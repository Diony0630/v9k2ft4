  /* ============================
     MD Parser (修复版 - 交通独立解析)
     ============================ */
  function parseTravelMd(mdText) {
    const trip = {
      id: genId(),
      title: '',
      dateRange: '',
      route: '',
      flights: [],
      hotels: [],
      transport: [],
      carry: [],
      luggage: [],
      days: [],
      checklist: [],
      lookup: [],
      lookupRaw: '',
      notes: [],
      materials: [],
      createdAt: new Date().toISOString()
    };

    const lines = mdText.split('\n');
    let currentSection = '';
    let currentDay = null;
    let currentTransport = null;
    let inTable = false;
    let tableHeaders = [];
    let checklistSubTitle = '';

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const trimmed = line.trim();

      // Skip image reference lines (e.g. @image:uuid.png)
      if (trimmed.startsWith('@image:') || trimmed.match(/^!\[.*\]\(.*\)$/)) continue;

      // Title
      if (trimmed.startsWith('# ') && !trip.title) {
        trip.title = trimmed.replace(/^# /, '').replace(/\*\*/g, '');
        continue;
      }

      // Date range from blockquote
      if (trimmed.startsWith('> 📅') || (trimmed.startsWith('>') && trimmed.includes('出行时间'))) {
        const m = trimmed.match(/(\d{4}年\d+月\d+日.*?[—–-]\s*\d+月\d+日)/);
        if (m) trip.dateRange = m[1].replace(/[—–]/g, '-').replace('年','/').replace(/月/g,'/').replace('日','');
        continue;
      }

      // Section headers (## level)
      if (trimmed.startsWith('## ')) {
        const h2 = trimmed.replace(/^## /, '').replace(/\*\*/g, '');
        if (h2.includes('航班')) currentSection = 'flights';
        else if (h2.includes('住宿')) currentSection = 'hotels';
        else if (h2.includes('交通')) { currentSection = 'transport'; currentTransport = null; }
        else if (h2.includes('随身') || h2.includes('携带')) { currentSection = 'carry'; }
        else if (h2.includes('行李') && h2.includes('寄存')) { currentSection = 'luggage'; }
        else if (h2.includes('每日行程') || h2.includes('日程')) { currentSection = 'days'; currentDay = null; }
        else if (h2.includes('餐饮')) currentSection = 'food';
        else if (h2.includes('景点')) currentSection = 'spots';
        else if ((h2.includes('行李') && !h2.includes('寄存')) || h2.includes('备忘') || h2.includes('清单')) { currentSection = 'checklist'; checklistSubTitle = ''; }
        else if (h2.includes('预算')) currentSection = 'budget';
        else if (h2.includes('注意') || h2.includes('记事') || h2.includes('备注')) currentSection = 'notes';
        else currentSection = '';
        inTable = false;
        continue;
      }

      // Sub-headers (### level) — critical fix: only create Day in 'days' section
      if (trimmed.startsWith('### ')) {
        inTable = false;
        tableHeaders = [];

        if (currentSection === 'days' || currentSection === 'day-detail') {
          // Only create new Day if this ### is in days section
          const dayMatch = trimmed.match(/Day\s*(\d+)/i);
          if (dayMatch) {
            const dayLabel = trimmed.replace(/^###\s*[\p{Emoji}\u200d\ufe0f]*\s*/u, '');
            currentDay = {
              index: parseInt(dayMatch[1]),
              label: dayLabel,
              checkpoints: []
            };
            trip.days.push(currentDay);
            currentSection = 'day-detail';
            continue;
          }
        }

        if (currentSection === 'transport') {
          const subTitle = trimmed.replace(/^###\s*[\p{Emoji}\u200d\ufe0f]*\s*/u, '').trim();
          // Check if it's carry/luggage sub-section
          if (subTitle.includes('随身') || subTitle.includes('携带')) {
            currentSection = 'carry'; continue;
          }
          if (subTitle.includes('行李') && subTitle.includes('寄存')) {
            currentSection = 'luggage'; continue;
          }
          // Transport sub-section title — store raw lines
          currentTransport = { title: subTitle, rawLines: [] };
          trip.transport.push(currentTransport);
          continue;
        }

        if (currentSection === 'checklist') {
          checklistSubTitle = trimmed.replace(/^###\s*/, '');
          continue;
        }

        continue;
      }

      // Parse tables
      if (trimmed.startsWith('|') && trimmed.endsWith('|')) {
        const cells = trimmed.split('|').slice(1, -1).map(c => c.trim());
        // Store raw table lines for transport and lookup
        if (currentSection === 'transport' && currentTransport) { currentTransport.rawLines.push(trimmed); }
        if (cells.every(c => /^[-:]+$/.test(c))) { inTable = true; continue; }
        if (!inTable) { tableHeaders = cells; inTable = true; continue; }

        // Flight table
        if (currentSection === 'flights' && tableHeaders.length >= 4) {
          const seg = {};
          tableHeaders.forEach((h, idx) => {
            const val = (cells[idx] || '').replace(/\*\*/g, '');
            if (h.includes('航段')) seg.segment = val;
            else if (h.includes('日期')) seg.date = val;
            else if (h.includes('航班')) seg.flight = val;
            else if (h.includes('行程') || h.includes('路线')) seg.route = val;
            else if (h.includes('时间')) seg.time = val;
          });
          if (seg.flight) trip.flights.push(seg);
        }

        // Hotel table
        if (currentSection === 'hotels' && tableHeaders.length >= 3) {
          const h = { nameJp: '', romaji: '', address: '', checkIn: '', checkOut: '', room: '', price: '', note: '', images: [], features: [] };
          tableHeaders.forEach((hdr, idx) => {
            const val = (cells[idx] || '').replace(/\*\*/g, '');
            if (hdr.includes('日期') || hdr.includes('晚')) h.date = val;
            else if (hdr.includes('住宿') || hdr.includes('酒店') || hdr.includes('名称')) h.name = val;
            else if (hdr.includes('房型')) h.room = val;
            else if (hdr.includes('价格') || hdr.includes('费用')) h.price = val;
            else if (hdr.includes('备注')) h.note = val;
            else if (hdr.includes('地址')) h.address = val;
            else if (hdr.includes('入住')) h.checkIn = val;
            else if (hdr.includes('退房')) h.checkOut = val;
          });
          if (h.name) trip.hotels.push(h);
        }

        // Day detail table (checkpoints)
        if (currentSection === 'day-detail' && currentDay && tableHeaders.length >= 2) {
          const cp = { type: 'itinerary', time: (cells[0] || ''), name: (cells[1] || ''), done: false, attachments: [], addReply: generateTravelReply(cells[1] || '', 'add'), doneReply: '' };
          if (cells[2]) cp.detail = cells[2];
          currentDay.checkpoints.push(cp);
        }

        continue;
      }

      // Non-table lines
      if (trimmed.startsWith('|')) continue; // broken table line
      inTable = false;

      // Checklist items (various formats)
      if (currentSection === 'checklist') {
        if (trimmed.startsWith('- [') || trimmed.startsWith('- ✅') || trimmed.startsWith('- ☑') || trimmed.startsWith('- ')) {
          const done = trimmed.includes('[x]') || trimmed.includes('[X]') || trimmed.includes('✅') || trimmed.includes('☑');
          const text = trimmed.replace(/^-\s*(\[.\]\s*|✅\s*|☑\s*)?/, '').trim();
          if (text && text.length > 1) trip.checklist.push({ text: (checklistSubTitle ? checklistSubTitle + '：' : '') + text, done });
        }
        continue;
      }

      // Notes section items
      if (currentSection === 'notes') {
        if (/^\d+\./.test(trimmed) || trimmed.startsWith('- ')) {
          const text = trimmed.replace(/^\d+\.\s*/, '').replace(/^-\s*/, '');
          if (text && text.length > 2) trip.notes.push({ id: genId(), title: text.substring(0, 20), text: text });
        }
        continue;
      }

      // Transport raw lines (non-table content: tips, blockquotes, etc.)
      if (currentSection === 'transport' && currentTransport && trimmed) {
        currentTransport.rawLines.push(trimmed);
        continue;
      }

      // Carry items (随身携带)
      if (currentSection === 'carry' && (trimmed.startsWith('- ') || /^\d+\./.test(trimmed))) {
        const text = trimmed.replace(/^-\s*/, '').replace(/^\d+\.\s*/, '').replace(/\*\*/g, '').trim();
        if (text) trip.carry.push(text);
        continue;
      }

      // Luggage storage items (行李寄存)
      if (currentSection === 'luggage' && (trimmed.startsWith('- ') || /^\d+\./.test(trimmed) || trimmed.length > 0)) {
        const text = trimmed.replace(/^-\s*/, '').replace(/^\d+\.\s*/, '').replace(/\*\*/g, '').trim();
        if (text && text.length > 1) trip.luggage.push(text);
        continue;
      }

      // Checkpoint items from list format (- 时间 地点)
      if (currentSection === 'day-detail' && currentDay && (trimmed.startsWith('- ') || /^\d+\./.test(trimmed))) {
        const text = trimmed.replace(/^-\s*/, '').replace(/^\d+\.\s*/, '');
        const timeMatch = text.match(/^(\d{1,2}[:.：]\d{2})\s*(.*)/);
        if (timeMatch) {
          currentDay.checkpoints.push({ type: 'itinerary', time: timeMatch[1], name: timeMatch[2], done: false, attachments: [], addReply: generateTravelReply(timeMatch[2], 'add'), doneReply: '' });
        } else if (text) {
          currentDay.checkpoints.push({ type: 'itinerary', time: '', name: text, done: false, attachments: [], addReply: generateTravelReply(text, 'add'), doneReply: '' });
        }
        continue;
      }
    }

    // Build route string
    if (trip.flights.length >= 1) {
      trip.route = trip.flights[0].route ? trip.flights[0].route.replace(/\*\*/g, '').replace(/→/g, ' → ') : '';
    }

    // Extract lookup data from blockquote for hotel enrichment only (not for lookup panel)
    {
      const bqMatch = mdText.match(/>\s*\*\*地名[速查对照]*表?\*\*[\s\S]*?(?=\n[^>]|\n\n[^>]|$)/i);
      if (bqMatch) {
        const bqLines = bqMatch[0].split('\n').filter(l => l.trim().startsWith('>'));
        bqLines.forEach(l => {
          const clean = l.replace(/^>\s*/, '').trim();
          if (!clean.startsWith('|') || !clean.endsWith('|')) return;
          const cells = clean.split('|').slice(1, -1).map(c => c.trim());
          if (cells.every(c => /^[-:]+$/.test(c))) return;
          if (cells.length >= 2 && cells[0] !== '中文') {
            trip.lookup.push({ cn: cells[0] || '', jp: cells[1] || '', romaji: cells[2] || '' });
          }
        });
      }
    }

    // Enrich hotels with japanese names from lookup
    if (trip.lookup.length > 0 && trip.hotels.length > 0) {
      trip.hotels.forEach(hotel => {
        if (!hotel.nameJp) {
          const match = trip.lookup.find(l => hotel.name && hotel.name.includes(l.cn));
          if (match) {
            hotel.nameJp = match.jp;
            hotel.romaji = match.romaji;
          }
        }
      });
    }

    // Ensure attachments array exists on all checkpoints
    trip.days.forEach(day => {
      day.checkpoints.forEach(cp => {
        if (!cp.attachments) cp.attachments = [];
      });
    });

    return trip;
  }

  // MD Import handler
  mdImportInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const trip = parseTravelMd(evt.target.result);
      if (!trip.title) trip.title = file.name.replace(/\.md$/, '');
      trips.unshift(trip);
      saveTrips();
      renderTravelList();
      showToast('✈️ 行程已导入：' + trip.title);
    };
    reader.readAsText(file);
    mdImportInput.value = '';
  });

  /* ============================
     JSON Export / Import (Travel)
     ============================ */
  document.getElementById('travelExportJsonBtn').addEventListener('click', () => {
    if (trips.length === 0) { showToast('📭 没有可导出的旅行数据'); return; }
    const exportData = { exportedAt: new Date().toISOString(), version: '2.1.0', trips: trips };
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `我的旅行_${getDateStr(new Date())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`📦 已导出 ${trips.length} 个行程`);
  });

  document.getElementById('travelImportJsonBtn').addEventListener('click', () => travelJsonImportInput.click());

  travelJsonImportInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        let importedTrips = [];
        if (Array.isArray(data)) importedTrips = data;
        else if (data && Array.isArray(data.trips)) importedTrips = data.trips;
        else { showToast('⚠️ JSON 格式不正确'); return; }

        const existingIds = new Set(trips.map(t => t.id));
        let count = 0;
        importedTrips.forEach(t => {
          if (existingIds.has(t.id)) t.id = genId();
          trips.unshift(t);
          count++;
        });
        if (count === 0) { showToast('⚠️ 未找到有效行程'); return; }
        saveTrips();
        renderTravelList();
        showToast(`📥 成功导入 ${count} 个行程`);
      } catch (err) { showToast('⚠️ JSON 解析失败'); }
    };
    reader.readAsText(file);
    travelJsonImportInput.value = '';
  });

      if (h.address) html += `<div class="hotel-detail-address">📍 ${escapeHtml(h.address)}</div>`;
      html += '<div class="hotel-detail-meta">';
      if (h.checkIn) html += `<span>🕐 入住 ${escapeHtml(h.checkIn)}</span>`;
      if (h.checkOut) html += `<span>🕐 退房 ${escapeHtml(h.checkOut)}</span>`;

      if (h.price) html += `<span>💰 ${escapeHtml(h.price)}</span>`;
      html += '</div>';
      if (h.features && h.features.length > 0) {
        html += '<div class="hotel-detail-features">';
        h.features.forEach(f => { html += `<span class="tag">${escapeHtml(f)}</span>`; });
        html += '</div>';

      if (h.note) html += `<div style="font-size:11px;color:var(--text-secondary);margin-top:4px">💡 ${escapeHtml(h.note)}</div>`;

        html += '</div>';
      }
      html += `<button class="hotel-upload-btn" data-hotel="${idx}">📎 上传预订单</button>`;
      html += '</div>';
    });
    el.innerHTML = html;

    // Hotel edit buttons

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        hotelImageInput.dataset.hotelIdx = btn.dataset.hotel;
        hotelImageInput.click();
      });
    });
  }

  hotelImageInput.addEventListener('change', async (e) => {

    const idx = parseInt(hotelImageInput.dataset.hotelIdx);
    const trip = getCurrentTrip();

      if (!trip.hotels[idx].images) trip.hotels[idx].images = [];

      saveTrips();
      renderHotelDetail(trip);
      showToast('📎 预订单已上传');

    hotelImageInput.value = '';
  });

  /* ============================
     Transport Panel (折叠)
     ============================ */
  // Inline markdown: **bold** → <strong>, *italic* → <em>
  function renderInlineMd(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      .replace(/`(.+?)`/g, '<code style="background:var(--bg-hover);padding:1px 4px;border-radius:3px;font-size:11px">$1</code>');
  }

  // Convert raw markdown table lines to HTML table
  function mdTableToHtml(rawLines) {
    const tableLines = rawLines.filter(l => l.startsWith('|') && l.endsWith('|'));
    if (tableLines.length < 2) return '';
    let html = '<table class="transport-raw-table">';
    let headerDone = false;
    for (let i = 0; i < tableLines.length; i++) {
      const cells = tableLines[i].split('|').slice(1, -1).map(c => c.trim());
      // Separator row
      if (cells.every(c => /^[-:]+$/.test(c))) { headerDone = true; continue; }
      if (!headerDone) {
        html += '<thead><tr>' + cells.map(c => `<th>${renderInlineMd(escapeHtml(c))}</th>`).join('') + '</tr></thead><tbody>';
      } else {
        html += '<tr>' + cells.map(c => `<td>${renderInlineMd(escapeHtml(c))}</td>`).join('') + '</tr>';
      }
    }
    html += '</tbody></table>';
    return html;
  }

  function renderTransportPanel(trip) {
    const el = document.getElementById('transportPanel');
    const hasTransport = trip.transport && trip.transport.length > 0;
    const hasCarry = trip.carry && trip.carry.length > 0;
    const hasLuggage = trip.luggage && trip.luggage.length > 0;
    if (!hasTransport && !hasCarry && !hasLuggage) { el.innerHTML = ''; return; }

    let html = `<div class="transport-panel" id="transportPanelBox">
      <div class="transport-header">
        <span class="transport-header-title">🚃 交通参考</span>
        <span class="transport-toggle">▼</span>
      </div>
      <div class="transport-body">`;

    // Transport sections with raw rendering
    if (hasTransport) {
      trip.transport.forEach(sec => {
        html += `<div class="transport-section"><div class="transport-section-title">${renderInlineMd(escapeHtml(sec.title))}</div>`;
        // Separate table lines from non-table lines
        const tableLines = sec.rawLines.filter(l => l.startsWith('|'));
        const nonTableLines = sec.rawLines.filter(l => !l.startsWith('|'));
        // Render table
        if (tableLines.length >= 2) {
          html += mdTableToHtml(sec.rawLines);
        }
        // Render non-table content (tips, notes, etc.)
        if (nonTableLines.length > 0) {
          html += '<div class="transport-raw-content">';
          nonTableLines.forEach(line => {
            if (line.startsWith('>')) {
              html += `<div class="transport-tip">💡 ${renderInlineMd(escapeHtml(line.replace(/^>\s*/, '')))}</div>`;
            } else if (line.startsWith('💡') || line.startsWith('⚠️')) {
              html += `<div class="transport-tip">${renderInlineMd(escapeHtml(line))}</div>`;
            } else {
              html += `<div>${renderInlineMd(escapeHtml(line))}</div>`;
            }
          });
          html += '</div>';
        }
        html += '</div>';
      });
    }

    // 随身携带 sub-section
    html += `<div class="transport-sub-section">
      <div class="transport-sub-title">🎒 随身携带 <button class="transport-sub-add" data-type="carry">+</button></div>
      <ul class="transport-sub-list" id="carryList">`;
    if (hasCarry) {
      trip.carry.forEach((item, idx) => {
        html += `<li>${renderInlineMd(escapeHtml(item))}</li>`;
      });
    } else {
      html += '<li style="color:var(--text-tertiary);font-style:italic">暂无内容，点击 + 添加</li>';
    }
    html += '</ul></div>';

    // 行李寄存 sub-section
    html += `<div class="transport-sub-section">
      <div class="transport-sub-title">🧳 行李寄存 <button class="transport-sub-add" data-type="luggage">+</button></div>
      <ul class="transport-sub-list" id="luggageList">`;
    if (hasLuggage) {
      trip.luggage.forEach((item, idx) => {
        html += `<li>${renderInlineMd(escapeHtml(item))}</li>`;
      });
    } else {
      html += '<li style="color:var(--text-tertiary);font-style:italic">暂无内容，点击 + 添加</li>';
    }
    html += '</ul></div>';

    html += '</div></div>';
    el.innerHTML = html;

    // Toggle
    const panel = document.getElementById('transportPanelBox');
    if (panel) {
      panel.querySelector('.transport-header').addEventListener('click', () => {
        panel.classList.toggle('open');
      });
    }

    // Add carry/luggage items
    el.querySelectorAll('.transport-sub-add').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const type = btn.dataset.type;
        const label = type === 'carry' ? '随身携带' : '行李寄存';
        const body = `
          <div class="form-group"><label class="form-label">内容</label><input class="form-input" id="subItemText" placeholder="如 ${type === 'carry' ? '护照、充电宝' : '东京站 コインロッカー'}"></div>
          <button class="form-submit-btn" id="subItemSave">添加</button>
        `;
        openFormModal('新增' + label + '项', body);
        setTimeout(() => {
          document.getElementById('subItemSave').addEventListener('click', () => {
            const text = document.getElementById('subItemText').value.trim();
            if (!text) { showToast('✏️ 请填写内容'); return; }
            const trip = getCurrentTrip();
            if (!trip) return;
            if (!trip[type]) trip[type] = [];
            trip[type].push(text);
            saveTrips(); closeFormModal(); renderTransportPanel(trip);
            showToast('✅ 已添加');
          });
        }, 50);
      });
    });
  }

  /* ============================
     Day Tabs & Checkpoints with Attachments
     ============================ */
  function renderDayTabs(trip) {
    const tabsEl = document.getElementById('dayTabs');
    const contentEl = document.getElementById('dayContent');
    if (!trip.days || trip.days.length === 0) { tabsEl.innerHTML = ''; contentEl.innerHTML = ''; return; }

    currentDayIndex = 0;
    let tabsHtml = '';
    trip.days.forEach((day, idx) => {
      tabsHtml += `<button class="day-tab${idx === 0 ? ' active' : ''}" data-day="${idx}">Day ${day.index}</button>`;
    });
    tabsEl.innerHTML = tabsHtml;
    renderDayPanel(trip);

    tabsEl.querySelectorAll('.day-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        tabsEl.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentDayIndex = parseInt(btn.dataset.day);
        renderDayPanel(trip);
      });
    });
  }

  function renderDayPanel(trip) {
    const contentEl = document.getElementById('dayContent');
    const day = trip.days[currentDayIndex];
    if (!day) { contentEl.innerHTML = ''; return; }

    let html = `<div class="day-panel active"><div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">${escapeHtml(day.label)}</div>`;
    html += '<div class="checkpoint-list">';
    day.checkpoints.forEach((cp, idx) => {
      const cpType = cp.type || 'itinerary';
      if (cpType === 'checkin') {
        // ---- Checkin card (打卡卡片) ----
        const imgsHtml = (cp.images && cp.images.length > 0) ? '<div class="checkin-card-images">' + cp.images.map(src => `<img src="${src}" alt="" onclick="window._openLightbox('${src.replace(/'/g, "\\'")}')">`).join('') + '</div>' : '';
        html += `<div class="checkin-card" data-idx="${idx}">
          <div class="checkin-card-actions">
            <button class="checkin-delete-btn" data-day="${currentDayIndex}" data-cp="${idx}" title="删除">🗑</button>
          </div>
          <div class="checkin-card-header">
            <span class="checkin-card-badge">打卡</span>
            <span class="checkin-card-title">${escapeHtml(cp.title || '')}</span>
          </div>
          <div class="checkin-card-meta">
            ${cp.location ? `<span>📍 ${escapeHtml(cp.location)}</span>` : ''}
            ${cp.time ? `<span>🕐 ${escapeHtml(cp.time)}</span>` : ''}
          </div>
          ${cp.content ? `<div class="checkin-card-content">${renderInlineMd(escapeHtml(cp.content))}</div>` : ''}
          ${imgsHtml}
          ${travelReplyHtml(cp.reply || '')}
        </div>`;
      } else {
        // ---- Itinerary card (行程卡片) ----
        const stateClass = cp.skipped ? ' skipped' : (cp.done ? ' checked' : '');
        const nameClass = cp.skipped ? ' skipped' : (cp.done ? ' done' : '');
        // 兼容旧数据：如果只有 cp.reply 没有 addReply/doneReply，迁移到新字段
        const addReply = cp.addReply || (cp.reply && !cp.done ? cp.reply : '') || '';
        const doneReply = cp.doneReply || (cp.reply && cp.done ? cp.reply : '') || '';
        const imageReply = cp.imageReply || '';

        // 行程条本体（行前提示嵌入卡片内部顶部）
        html += `<div class="checkpoint-item" style="flex-wrap:wrap">`;
        // 行前提示横幅（仅未完成时显示，内嵌卡片顶部）
        if (!cp.done && !cp.skipped && addReply) {
          html += itineraryPreHintHtml(addReply);
        }
        html += `<div class="checkpoint-check${stateClass}" data-day="${currentDayIndex}" data-cp="${idx}"></div>
          <div class="checkpoint-info" style="flex:1;min-width:0">
            <div class="checkpoint-time">${escapeHtml(cp.time)}</div>
            <div class="checkpoint-name${nameClass}">${renderInlineMd(escapeHtml(cp.name || ''))}</div>
            ${cp.detail ? `<div class="checkpoint-detail">${renderInlineMd(escapeHtml(cp.detail))}</div>` : ''}
          </div>
          <div class="checkpoint-actions">
            <button class="checkpoint-skip-btn" data-day="${currentDayIndex}" data-cp="${idx}" title="${cp.skipped ? '取消跳过' : '跳过'}">⊘</button>
            <button class="checkpoint-delete-btn" data-day="${currentDayIndex}" data-cp="${idx}" title="删除">🗑</button>
            <button class="checkpoint-add-btn" data-day="${currentDayIndex}" data-cp="${idx}" title="添加攻略">+</button>
          </div>`;
        // Render attachments
        if (cp.attachments && cp.attachments.length > 0) {
          html += '<div class="checkpoint-attachments" style="width:100%;margin-left:34px">';
          cp.attachments.forEach((att, ai) => {
            const thumb = att.images && att.images.length > 0 ? `<img class="attachment-bar-thumb" src="${att.images[0]}" alt="">` : '';
            const preview = att.content ? att.content.substring(0, 20) : '';
            html += `<div class="attachment-bar" data-day="${currentDayIndex}" data-cp="${idx}" data-att="${ai}">
            <span class="attachment-bar-icon">📌</span>
            <span class="attachment-bar-title">${escapeHtml(att.title)}</span>
            <span class="attachment-bar-preview">${escapeHtml(preview)}</span>
            ${thumb}
          </div>`;
          });
          html += '</div>';
        }
        html += '</div>';

        // 完成后帖子回复（下方，仅勾选完成时显示）
        if (cp.done && doneReply) {
          html += itineraryPostReplyHtml(doneReply);
        }
        // 图片上传触发回复（下方，有图片回复时常显）
        if (imageReply) {
          html += itineraryPostReplyHtml(imageReply);
        }
      }
    });
    // Add buttons
    html += `</div>
      <button class="add-item-btn" id="addCheckpointBtn">+ 添加行程</button>
      <button class="add-item-btn" id="addCheckinBtn">+ 添加打卡</button>
    </div>`;
    contentEl.innerHTML = html;

    // Checkpoint toggle (tap circle: unchecked → done → unchecked; skipped state managed separately)
    contentEl.querySelectorAll('.checkpoint-check').forEach(el => {
      el.addEventListener('click', () => {
        const di = parseInt(el.dataset.day);
        const ci = parseInt(el.dataset.cp);
        const t = getCurrentTrip();
        if (t && t.days[di] && t.days[di].checkpoints[ci]) {
          const cp = t.days[di].checkpoints[ci];
          if (cp.skipped) {
            // If skipped, clicking circle un-skips it
            cp.skipped = false;
          } else {
            cp.done = !cp.done;
            // 勾选完成时生成完成回复，取消勾选时清除完成回复
            if (cp.done) {
              cp.doneReply = generateTravelReply(cp.name || '', 'done');
            } else {
              cp.doneReply = '';
            }
          }
          saveTrips();
          renderDayPanel(t);
        }
      });
    });

    // Skip button
    contentEl.querySelectorAll('.checkpoint-skip-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const di = parseInt(btn.dataset.day);
        const ci = parseInt(btn.dataset.cp);
        const t = getCurrentTrip();
        if (t && t.days[di] && t.days[di].checkpoints[ci]) {
          const cp = t.days[di].checkpoints[ci];
          cp.skipped = !cp.skipped;
          if (cp.skipped) cp.done = false;
          saveTrips();
          renderDayPanel(t);
        }
      });
    });

    // Delete button
    contentEl.querySelectorAll('.checkpoint-delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const di = parseInt(btn.dataset.day);
        const ci = parseInt(btn.dataset.cp);
        const t = getCurrentTrip();
        if (t && t.days[di] && t.days[di].checkpoints[ci]) {
          t.days[di].checkpoints.splice(ci, 1);
          saveTrips();
          renderDayPanel(t);
          showToast('🗑️ 行程已删除');
        }
      });
    });

    // Add attachment button
    contentEl.querySelectorAll('.checkpoint-add-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        openAttachmentModal(parseInt(btn.dataset.day), parseInt(btn.dataset.cp));
      });
    });

    // View attachment
    contentEl.querySelectorAll('.attachment-bar').forEach(bar => {
      bar.addEventListener('click', () => {
        const di = parseInt(bar.dataset.day);
        const ci = parseInt(bar.dataset.cp);
        const ai = parseInt(bar.dataset.att);
        viewAttachment(di, ci, ai);
      });
    });

    // Add checkpoint button
    const addCpBtn = document.getElementById('addCheckpointBtn');
    if (addCpBtn) {
      addCpBtn.addEventListener('click', () => {
        openAddCheckpointModal();
      });
    }

    // Add checkin button
    const addCiBtn = document.getElementById('addCheckinBtn');
    if (addCiBtn) {
      addCiBtn.addEventListener('click', () => {
        openAddCheckinModal();
      });
    }

    // Checkin card delete
    contentEl.querySelectorAll('.checkin-delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const di = parseInt(btn.dataset.day);
        const ci = parseInt(btn.dataset.cp);
        const t = getCurrentTrip();
        if (t && t.days[di] && t.days[di].checkpoints[ci]) {
          if (!confirm('确定删除这条打卡记录？')) return;
          t.days[di].checkpoints.splice(ci, 1);
          saveTrips();
          renderDayPanel(t);
          showToast('🗑️ 打卡已删除');
        }
      });
    });
  }

  /* ============================
     Attachment Modal (攻略附件)
     ============================ */
  function openAttachmentModal(dayIdx, cpIdx) {
    pendingAttachmentImages = [];
    const body = `
      <div class="form-group"><label class="form-label">标题</label><input class="form-input" id="attTitle" placeholder="如：排队攻略"></div>
      <div class="form-group"><label class="form-label">正文</label><textarea class="form-textarea" id="attContent" placeholder="写下你的攻略/笔记..."></textarea></div>
      <div class="form-group">
        <label class="form-label">图片（可选）</label>
        <button class="hotel-upload-btn" id="attAddImg" style="margin-top:0">📷 添加图片</button>
        <div class="form-image-previews" id="attImgPreviews"></div>
      </div>
      <button class="form-submit-btn" id="attSave">发布</button>
    `;
    openFormModal('添加攻略', body);
    setTimeout(() => {
      document.getElementById('attAddImg').addEventListener('click', () => {
        attachmentImageInput.dataset.dayIdx = dayIdx;
        attachmentImageInput.dataset.cpIdx = cpIdx;
        attachmentImageInput.click();
      });
      document.getElementById('attSave').addEventListener('click', () => {
        const title = document.getElementById('attTitle').value.trim();
        const content = document.getElementById('attContent').value.trim();
        if (!title && !content) { showToast('✏️ 请至少填写标题或正文'); return; }
        const trip = getCurrentTrip();
        if (!trip) return;
        const cp = trip.days[dayIdx] && trip.days[dayIdx].checkpoints[cpIdx];
        if (!cp) return;
        if (!cp.attachments) cp.attachments = [];
        cp.attachments.push({ id: genId(), title: title || '未命名', content, images: [...pendingAttachmentImages] });
        // 方案4：检测到图片上传时触发 image_upload 回复（仅行程条类型）
        if (pendingAttachmentImages.length > 0 && (cp.type || 'itinerary') === 'itinerary') {
          cp.imageReply = generateTravelReply(cp.name || '', 'image_upload');
        }
        saveTrips();
        closeFormModal();
        renderDayPanel(trip);
        showToast('📌 攻略已添加');
      });
    }, 50);
  }

  // Attachment image upload
  attachmentImageInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const dataUrl = await compressImage(file);
      if (dataUrl) pendingAttachmentImages.push(dataUrl);
    }
    const previews = document.getElementById('attImgPreviews');
    if (previews) {
      previews.innerHTML = pendingAttachmentImages.map((src, i) => `
        <div class="preview-item"><img src="${src}" alt=""></div>
      `).join('');
    }
    attachmentImageInput.value = '';
  });

  function viewAttachment(dayIdx, cpIdx, attIdx) {
    const trip = getCurrentTrip();
    if (!trip) return;
    const att = trip.days[dayIdx] && trip.days[dayIdx].checkpoints[cpIdx] && trip.days[dayIdx].checkpoints[cpIdx].attachments[attIdx];
    if (!att) return;
    let imgsHtml = '';
    if (att.images && att.images.length > 0) {
      imgsHtml = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">';
      att.images.forEach(img => { imgsHtml += `<img src="${img}" style="max-width:100%;border-radius:8px;cursor:pointer" onclick="window._openLightbox('${img.replace(/'/g, "\\'")}')">` });
      imgsHtml += '</div>';
    }
    const body = `
      <div style="font-size:14px;color:var(--text-primary);line-height:1.7;white-space:pre-wrap">${escapeHtml(att.content || '（无正文）')}</div>
      ${imgsHtml}
      <button class="form-submit-btn" style="margin-top:16px;background:var(--danger)" id="attDeleteBtn">删除此攻略</button>
    `;
    openFormModal(att.title, body);
    setTimeout(() => {
      document.getElementById('attDeleteBtn').addEventListener('click', () => {
        trip.days[dayIdx].checkpoints[cpIdx].attachments.splice(attIdx, 1);
        saveTrips();
        closeFormModal();
        renderDayPanel(trip);
        showToast('🗑️ 攻略已删除');
      });
    }, 50);
  }

  function openAddCheckpointModal() {
    const body = `
      <div class="form-group"><label class="form-label">时间（可选）</label><input class="form-input" id="cpTime" placeholder="如 14:00"></div>
      <div class="form-group"><label class="form-label">地点/事项</label><input class="form-input" id="cpName" placeholder="如 大室山山顶"></div>
      <button class="form-submit-btn" id="cpSave">添加</button>
    `;
    openFormModal('新增行程', body);
    setTimeout(() => {
      document.getElementById('cpSave').addEventListener('click', () => {
        const name = document.getElementById('cpName').value.trim();
        if (!name) { showToast('✏️ 请填写地点/事项'); return; }
        const trip = getCurrentTrip();
        if (!trip || !trip.days[currentDayIndex]) return;
        const cpItem = {
          type: 'itinerary',
          time: document.getElementById('cpTime').value.trim(),
          name, done: false, attachments: [],
          addReply: generateTravelReply(name, 'add'),
          doneReply: ''
        };
        trip.days[currentDayIndex].checkpoints.push(cpItem);
        saveTrips();
        closeFormModal();
        renderDayPanel(trip);
        showToast('📍 行程已添加');
      });
    }, 50);
  }

  /* ============================
     Checkin Modal (添加打卡)
     ============================ */
  let pendingCheckinImages = [];

  function openAddCheckinModal() {
    pendingCheckinImages = [];
    const trip = getCurrentTrip();
    if (!trip || !trip.days[currentDayIndex]) return;
    const day = trip.days[currentDayIndex];
    // Build itinerary options for "插入位置" select
    const itineraryItems = [];
    day.checkpoints.forEach((cp, idx) => {
      if ((cp.type || 'itinerary') === 'itinerary') {
        itineraryItems.push({ idx, label: (cp.time ? cp.time + ' ' : '') + (cp.name || '未命名') });
      }
    });
    let selectHtml = '<option value="-1">添加到末尾</option>';
    itineraryItems.forEach(it => {
      selectHtml += `<option value="${it.idx}">${escapeHtml(it.label)}</option>`;
    });

    const body = `
      <div class="form-group"><label class="form-label">插入在哪个行程后面</label><select class="form-input" id="ciAfter" style="height:38px">${selectHtml}</select></div>
      <div class="form-group"><label class="form-label">标题</label><input class="form-input" id="ciTitle" placeholder="如：大室山打卡"></div>
      <div style="display:flex;gap:10px">
        <div class="form-group" style="flex:1"><label class="form-label">地点</label><input class="form-input" id="ciLocation" placeholder="如：大室山山顶"></div>
        <div class="form-group" style="flex:1"><label class="form-label">时间</label><input class="form-input" id="ciTime" placeholder="如 14:30"></div>
      </div>
      <div class="form-group"><label class="form-label">内容</label><textarea class="form-textarea" id="ciContent" placeholder="记录你的打卡感受..."></textarea></div>
      <div class="form-group">
        <label class="form-label">图片（可选）</label>
        <button class="hotel-upload-btn" id="ciAddImg" style="margin-top:0">📷 添加图片</button>
        <div class="form-image-previews" id="ciImgPreviews"></div>
      </div>
      <button class="form-submit-btn" id="ciSave">发布打卡</button>
    `;
    openFormModal('添加打卡', body);
    setTimeout(() => {
      document.getElementById('ciAddImg').addEventListener('click', () => {
        checkinImageInput.click();
      });
      document.getElementById('ciSave').addEventListener('click', () => {
        const title = document.getElementById('ciTitle').value.trim();
        if (!title) { showToast('✏️ 请填写标题'); return; }
        const trip = getCurrentTrip();
        if (!trip || !trip.days[currentDayIndex]) return;
        const afterIdx = parseInt(document.getElementById('ciAfter').value);
        const checkinItem = {
          type: 'checkin',
          title,
          location: document.getElementById('ciLocation').value.trim(),
          time: document.getElementById('ciTime').value.trim(),
          content: document.getElementById('ciContent').value.trim(),
          images: [...pendingCheckinImages],
          reply: generateTravelReply(
            title + ' ' + document.getElementById('ciContent').value.trim() + ' ' + document.getElementById('ciLocation').value.trim(),
            'checkin'
          )
        };
        const day = trip.days[currentDayIndex];
        if (afterIdx >= 0 && afterIdx < day.checkpoints.length) {
          // Insert after the selected itinerary item
          day.checkpoints.splice(afterIdx + 1, 0, checkinItem);
        } else {
          // Append to end
          day.checkpoints.push(checkinItem);
        }
        saveTrips();
        closeFormModal();
        renderDayPanel(trip);
        showToast('📸 打卡已发布');
      });
    }, 50);
  }

  checkinImageInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const dataUrl = await compressImage(file);
      if (dataUrl) pendingCheckinImages.push(dataUrl);
    }
    const previews = document.getElementById('ciImgPreviews');
    if (previews) {
      previews.innerHTML = pendingCheckinImages.map((src, i) => `
        <div class="preview-item"><img src="${src}" alt=""></div>
      `).join('');
    }
    checkinImageInput.value = '';
  });

  /* ============================
     Guide Carousel (攻略/地图轮播)
     ============================ */
  const guideUploadInput = document.getElementById('guideUploadInput');

  function renderGuideCarousel(trip) {
    const el = document.getElementById('guideCarousel');
    if (!trip) { el.style.display = 'none'; return; }
    el.style.display = '';

    const guides = trip.guides || [];
    let html = '<div class="guide-carousel-header">';
    html += '<span class="guide-carousel-title">🗺️ 攻略 / 地图</span>';
    html += '<button class="guide-upload-btn" id="guideUploadBtn">+ 上传图片</button>';
    html += '</div>';

    if (guides.length > 0) {
      html += '<div class="guide-scroll" id="guideScroll">';
      guides.forEach((g, idx) => {
        html += `<div class="guide-card" data-idx="${idx}">
          <img src="${g.image}" alt="${escapeHtml(g.caption || '')}" onclick="window._openLightbox('${g.image.replace(/'/g, "\\'")}')">
          <div class="guide-card-caption" contenteditable="true" data-idx="${idx}" placeholder="点击添加说明...">${escapeHtml(g.caption || '')}</div>
          <button class="guide-card-delete" data-idx="${idx}">&times;</button>
        </div>`;
      });
      html += '</div>';
      // Dots indicator
      if (guides.length > 1) {
        html += '<div class="guide-dots" id="guideDots">';
        guides.forEach((_, i) => {
          html += `<div class="guide-dot${i === 0 ? ' active' : ''}"></div>`;
        });
        html += '</div>';
      }
    } else {
      html += '<div class="guide-empty"><div class="guide-empty-icon">🗺️</div>上传路线图、景区地图等攻略图片<br>支持横向滑动查看</div>';
    }

    el.innerHTML = html;

    // Upload button
    document.getElementById('guideUploadBtn').addEventListener('click', () => {
      guideUploadInput.click();
    });

    // Handle file upload (multiple)
    guideUploadInput.onchange = async (ev) => {
      const files = Array.from(ev.target.files);
      if (!files.length) return;
      const trip = getCurrentTrip();
      if (!trip) return;
      if (!trip.guides) trip.guides = [];

      for (const file of files) {
        const img = await compressGuideImage(file);
        if (img) {
          trip.guides.push({ id: genId(), image: img, caption: '' });
        }
      }
      guideUploadInput.value = '';
      saveTrips();
      renderGuideCarousel(trip);
      showToast('🗺️ 攻略图片已上传');
    };

    // Delete buttons
    el.querySelectorAll('.guide-card-delete').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const trip = getCurrentTrip();
        if (!trip || !trip.guides) return;
        trip.guides.splice(parseInt(btn.dataset.idx), 1);
        saveTrips();
        renderGuideCarousel(trip);
        showToast('🗑️ 图片已删除');
      });
    });

    // Caption editing (contenteditable blur save)
    el.querySelectorAll('.guide-card-caption').forEach(cap => {
      cap.addEventListener('blur', () => {
        const trip = getCurrentTrip();
        if (!trip || !trip.guides) return;
        const idx = parseInt(cap.dataset.idx);
        if (trip.guides[idx]) {
          trip.guides[idx].caption = cap.textContent.trim();
          saveTrips();
        }
      });
      // Prevent enter from creating new lines - save on enter
      cap.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          cap.blur();
        }
      });
    });

    // Scroll dot indicator
    const scroll = document.getElementById('guideScroll');
    const dots = document.getElementById('guideDots');
    if (scroll && dots) {
      scroll.addEventListener('scroll', () => {
        const cards = scroll.querySelectorAll('.guide-card');
        if (!cards.length) return;
        const scrollLeft = scroll.scrollLeft;
        const cardWidth = cards[0].offsetWidth + 10; // gap
        const activeIdx = Math.round(scrollLeft / cardWidth);
        dots.querySelectorAll('.guide-dot').forEach((d, i) => {
          d.classList.toggle('active', i === activeIdx);
        });
      });
    }
  }

  function renderLookupPanel(trip) {
    const el = document.getElementById('panelLookup');
    let html = '';
    // Render from lookupRaw (paste-mode data)
    if (trip.lookupRaw && trip.lookupRaw.trim()) {
      const rawLines = trip.lookupRaw.trim().split('\n').filter(l => l.startsWith('|'));
      if (rawLines.length >= 2) {
        html = mdTableToHtmlWithDelete(rawLines, trip);
      }
    }
    // Fallback to structured data
    if (!html && trip.lookup && trip.lookup.length > 0) {
      html = '<table class="lookup-table"><thead><tr><th>中文</th><th>日文</th><th>罗马音</th><th style="width:36px"></th></tr></thead><tbody>';
      trip.lookup.forEach((l, i) => {
        html += `<tr><td>${escapeHtml(l.cn)}</td><td>${escapeHtml(l.jp)}</td><td>${escapeHtml(l.romaji)}</td>
          <td><button class="lookup-del-btn" data-idx="${i}" title="删除">×</button></td></tr>`;
      });
      html += '</tbody></table>';
    }
    if (!html) {
      html = '<div style="text-align:center;color:var(--text-tertiary);padding:30px 20px;line-height:1.8">' +
        '<div style="font-size:24px;margin-bottom:8px">🗺️</div>' +
        '<div>粘贴 MD 表格或逐条添加速查项</div></div>';
    }
    html += `<div class="lookup-btn-row">
      <button class="add-item-btn" id="addLookupBtn">+ 逐条添加</button>
      <button class="add-item-btn" id="pasteLookupBtn" style="background:var(--bg-hover)">📋 粘贴表格</button>
    </div>`;
    el.innerHTML = html;

    // Delete buttons for structured rows
    el.querySelectorAll('.lookup-del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        const t = getCurrentTrip();
        if (!t) return;
        // If from lookupRaw, rebuild
        if (t.lookupRaw && t.lookupRaw.trim()) {
          const rawLines = t.lookupRaw.trim().split('\n').filter(l => l.startsWith('|'));
          // idx is data-row index (0-based, after header+separator)
          let dataIdx = 0;
          const kept = [];
          let headerDone = false;
          for (const line of rawLines) {
            const cells = line.split('|').slice(1, -1).map(c => c.trim());
            if (cells.every(c => /^[-:]+$/.test(c))) { kept.push(line); headerDone = true; continue; }
            if (!headerDone) { kept.push(line); continue; }
            if (dataIdx !== idx) kept.push(line);
            dataIdx++;
          }
          t.lookupRaw = kept.join('\n') + '\n';
          // Also remove from structured
          if (t.lookup && t.lookup[idx]) t.lookup.splice(idx, 1);
        } else {
          t.lookup.splice(idx, 1);
        }
        saveTrips(); renderLookupPanel(t);
        showToast('🗑 已删除');
      });
    });

    // Single-item add
    document.getElementById('addLookupBtn').addEventListener('click', () => {
      const body = `
        <div class="form-group"><label class="form-label">中文</label><input class="form-input" id="lookupCn" placeholder="大室山"></div>
        <div class="form-group"><label class="form-label">日文</label><input class="form-input" id="lookupJp" placeholder="おおむろさん"></div>
        <div class="form-group"><label class="form-label">罗马音</label><input class="form-input" id="lookupRomaji" placeholder="Oomuro-san"></div>
        <button class="form-submit-btn" id="lookupSave">添加</button>
      `;
      openFormModal('新增速查项', body);
      setTimeout(() => {
        document.getElementById('lookupSave').addEventListener('click', () => {
          const cn = document.getElementById('lookupCn').value.trim();
          if (!cn) { showToast('✏️ 请至少填写中文名'); return; }
          const trip = getCurrentTrip();
          if (!trip) return;
          if (!trip.lookup) trip.lookup = [];
          const jp = document.getElementById('lookupJp').value.trim();
          const romaji = document.getElementById('lookupRomaji').value.trim();
          trip.lookup.push({ cn, jp, romaji });
          // Also update lookupRaw
          if (!trip.lookupRaw) trip.lookupRaw = '| 中文 | 日文 | 罗马音 |\n| --- | --- | --- |\n';
          trip.lookupRaw += `| ${cn} | ${jp} | ${romaji} |\n`;
          saveTrips(); closeFormModal(); renderLookupPanel(trip);
          showToast('🗺️ 速查项已添加');
        });
      }, 50);
    });

    // Paste MD table
    document.getElementById('pasteLookupBtn').addEventListener('click', () => {
      const body = `
        <div class="form-group">
          <label class="form-label">粘贴 Markdown 表格</label>
          <div style="font-size:11px;color:var(--text-tertiary);margin-bottom:8px">
            支持标准 MD 表格格式，也支持 blockquote（> 开头）的表格。粘贴后自动解析渲染。
          </div>
          <textarea class="form-input" id="lookupPasteMd" rows="10" placeholder="| 中文 | 日文 | 罗马音 |
|:---|:---|:---|
| 成田机场 | 成田国際空港 | *Narita* |
| 东京站 | 東京駅 | *Tokyo Eki* |" style="font-family:monospace;font-size:12px;line-height:1.6;resize:vertical"></textarea>
        </div>
        <div id="lookupPastePreview" style="margin-bottom:12px"></div>
        <button class="form-submit-btn" id="lookupPasteConfirm">确认导入</button>
      `;
      openFormModal('📋 粘贴速查表格', body);
      setTimeout(() => {
        const ta = document.getElementById('lookupPasteMd');
        const preview = document.getElementById('lookupPastePreview');
        // Live preview
        ta.addEventListener('input', () => {
          const lines = parsePastedMdTable(ta.value);
          if (lines.length >= 2) {
            preview.innerHTML = '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:4px">预览：</div>' + mdTableToHtml(lines);
          } else {
            preview.innerHTML = '<div style="font-size:11px;color:var(--text-tertiary)">暂未识别到有效表格行</div>';
          }
        });

        document.getElementById('lookupPasteConfirm').addEventListener('click', () => {
          const lines = parsePastedMdTable(ta.value);
          if (lines.length < 2) { showToast('❌ 未识别到有效表格'); return; }
          const trip = getCurrentTrip();
          if (!trip) return;
          // Replace existing lookup data
          trip.lookupRaw = lines.join('\n') + '\n';
          trip.lookup = [];
          let headerDone = false;
          for (const line of lines) {
            const cells = line.split('|').slice(1, -1).map(c => c.trim());
            if (cells.every(c => /^[-:]+$/.test(c))) { headerDone = true; continue; }
            if (!headerDone) continue; // skip header row
            if (cells.length >= 2) {
              trip.lookup.push({ cn: cells[0] || '', jp: cells[1] || '', romaji: cells[2] || '' });
            }
          }
          saveTrips(); closeFormModal(); renderLookupPanel(trip);
          showToast('🗺️ 速查表已导入（' + trip.lookup.length + '条）');
        });
      }, 50);
    });
  }

  // Parse pasted MD table text — strip blockquote prefix, filter valid table lines
  function parsePastedMdTable(text) {
    return text.split('\n')
      .map(l => l.replace(/^>\s*/, '').trim())       // strip blockquote >
      .filter(l => l.startsWith('|') && l.endsWith('|'))
      .filter(l => !l.includes('@image:'));
  }

  // mdTableToHtml variant with delete buttons per data row
  function mdTableToHtmlWithDelete(rawLines, trip) {
    const tableLines = rawLines.filter(l => l.startsWith('|') && l.endsWith('|'));
    if (tableLines.length < 2) return '';
    let html = '<table class="lookup-table">';
    let headerDone = false;
    let dataIdx = 0;
    for (let i = 0; i < tableLines.length; i++) {
      const cells = tableLines[i].split('|').slice(1, -1).map(c => c.trim());
      if (cells.every(c => /^[-:]+$/.test(c))) { headerDone = true; continue; }
      if (!headerDone) {
        html += '<thead><tr>' + cells.map(c => `<th>${renderInlineMd(escapeHtml(c))}</th>`).join('') +
          '<th style="width:36px"></th></tr></thead><tbody>';
      } else {
        html += '<tr>' + cells.map(c => `<td>${renderInlineMd(escapeHtml(c))}</td>`).join('') +
          `<td><button class="lookup-del-btn" data-idx="${dataIdx}" title="删除">×</button></td></tr>`;
        dataIdx++;
      }
    }
    html += '</tbody></table>';
    return html;
  }

    });

    // Add material
    document.getElementById('addMaterialBtn').addEventListener('click', () => {
      const body = `
        <div class="form-group"><label class="form-label">标签（如"签证页"、"预订单"）</label><input class="form-input" id="matLabel" placeholder="签证页"></div>
        <div class="form-group">
          <label class="form-label">选择图片</label>
          <button class="hotel-upload-btn" id="matSelectImg" style="margin-top:0">📷 选择图片</button>
          <div id="matPreview" style="margin-top:8px"></div>
        </div>
        <button class="form-submit-btn" id="matSave">上传</button>
      `;
      openFormModal('上传关键材料', body);
      let matImage = '';
      setTimeout(() => {
        document.getElementById('matSelectImg').addEventListener('click', () => materialUploadInput.click());
        materialUploadInput.onchange = async (ev) => {
          const file = ev.target.files[0];
          if (!file) return;
          matImage = await compressImage(file);
          if (matImage) {
            document.getElementById('matPreview').innerHTML = `<img src="${matImage}" style="max-width:100%;max-height:200px;border-radius:8px">`;
          }
          materialUploadInput.value = '';
        };
        document.getElementById('matSave').addEventListener('click', () => {
          const label = document.getElementById('matLabel').value.trim() || '未命名';
          if (!matImage) { showToast('📷 请先选择图片'); return; }
          const trip = getCurrentTrip();
          if (!trip) return;
          if (!trip.materials) trip.materials = [];
          trip.materials.push({ id: genId(), label, image: matImage });
          saveTrips(); closeFormModal(); renderMaterialsPanel(trip);
          showToast('📎 材料已上传');
        });
      }, 50);
    });
  }

  // Sub tab switching
  document.getElementById('subTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.sub-tab');
    if (!btn) return;
    document.querySelectorAll('#subTabs .sub-tab').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('#subContent .sub-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    const panel = btn.dataset.panel;
    document.getElementById('panel' + panel.charAt(0).toUpperCase() + panel.slice(1)).classList.add('active');
  });

  /* ============================
     Reply Settings Panel (回复规则设置)
     ============================ */
  const RS_FRAGMENT_KEY = 'my_fragment_reply_rules';
  const RS_TRAVEL_KEY  = 'my_travel_reply_rules';

  // Category display names
  const FRAGMENT_CATEGORY_LABELS = {
    affection: '💕 亲密', food: '🍜 美食', sleep: '😴 睡眠',
    emotion: '💭 情绪', effort: '💪 工作', morning: '🌅 早安',
    sick: '🤒 身体', night: '🌙 晚安',
    _default: '📝 通用兜底', _latenight: '🌃 深夜兜底', _busyday: '📊 忙碌日'
  };
  const TRAVEL_CATEGORY_LABELS = {
    airport: '✈️ 机场', depart: '🚀 出发', hotel: '🏨 住宿',
    food: '🍣 美食', scenery: '🏔️ 风景', transport: '🚃 交通', shopping: '🛍️ 购物',
    _default: '📝 通用兜底', _done: '✅ 完成打卡', _image: '📷 图片上传'
  };

  // Deep clone defaults for reset
  const FRAGMENT_RULES_DEFAULT = JSON.parse(JSON.stringify(REPLY_RULES));
  const FRAGMENT_DEFAULT_REPLIES_DEFAULT = [...DEFAULT_REPLIES];
  const FRAGMENT_LATENIGHT_DEFAULT = [...LATE_NIGHT_REPLIES];
  const FRAGMENT_BUSYDAY_DEFAULT = [...BUSY_DAY_REPLIES];
  const TRAVEL_RULES_DEFAULT = JSON.parse(JSON.stringify(TRAVEL_REPLY_RULES));
  const TRAVEL_DEFAULT_REPLIES_DEFAULT = [...TRAVEL_DEFAULT_REPLIES];
  const TRAVEL_DONE_REPLIES_DEFAULT = [...TRAVEL_DONE_REPLIES];
  const TRAVEL_IMAGE_UPLOAD_REPLIES_DEFAULT = [...TRAVEL_IMAGE_UPLOAD_REPLIES];

  // Load saved rules from localStorage
  function loadReplyRulesFromStorage() {
    try {
      const fragData = localStorage.getItem(RS_FRAGMENT_KEY);
      if (fragData) {
        const parsed = JSON.parse(fragData);
        if (parsed.rules) REPLY_RULES = parsed.rules;
        if (parsed.defaultReplies) DEFAULT_REPLIES.splice(0, DEFAULT_REPLIES.length, ...parsed.defaultReplies);
        if (parsed.lateNightReplies) LATE_NIGHT_REPLIES.splice(0, LATE_NIGHT_REPLIES.length, ...parsed.lateNightReplies);
        if (parsed.busyDayReplies) BUSY_DAY_REPLIES.splice(0, BUSY_DAY_REPLIES.length, ...parsed.busyDayReplies);
      }
    } catch(e) { console.warn('Load fragment reply rules failed:', e); }
    try {
      const travelData = localStorage.getItem(RS_TRAVEL_KEY);
      if (travelData) {
        const parsed = JSON.parse(travelData);
        if (parsed.rules) TRAVEL_REPLY_RULES = parsed.rules;
        if (parsed.defaultReplies) TRAVEL_DEFAULT_REPLIES.splice(0, TRAVEL_DEFAULT_REPLIES.length, ...parsed.defaultReplies);
        if (parsed.doneReplies) TRAVEL_DONE_REPLIES.splice(0, TRAVEL_DONE_REPLIES.length, ...parsed.doneReplies);
        if (parsed.imageUploadReplies) TRAVEL_IMAGE_UPLOAD_REPLIES.splice(0, TRAVEL_IMAGE_UPLOAD_REPLIES.length, ...parsed.imageUploadReplies);
      }
    } catch(e) { console.warn('Load travel reply rules failed:', e); }
  }

  function saveFragmentRules() {
    localStorage.setItem(RS_FRAGMENT_KEY, JSON.stringify({
      rules: REPLY_RULES,
      defaultReplies: [...DEFAULT_REPLIES],
      lateNightReplies: [...LATE_NIGHT_REPLIES],
      busyDayReplies: [...BUSY_DAY_REPLIES]
    }));
  }

  function saveTravelRules() {
    localStorage.setItem(RS_TRAVEL_KEY, JSON.stringify({
      rules: TRAVEL_REPLY_RULES,
      defaultReplies: [...TRAVEL_DEFAULT_REPLIES],
      doneReplies: [...TRAVEL_DONE_REPLIES],
      imageUploadReplies: [...TRAVEL_IMAGE_UPLOAD_REPLIES]
    }));
  }

  // Render helpers
  function escHtml(str) {
    const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
  }

  function renderChips(items, type, onDelete) {
    return items.map((item, i) =>
      `<span class="rs-chip ${type}">
        <span class="rs-chip-text" title="${escHtml(item)}">${escHtml(item)}</span>
        <button class="chip-del" data-idx="${i}">✕</button>
      </span>`
    ).join('');
  }

  function buildCategoryCard(key, label, data, mode) {
    const kws = data.keywords || [];
    const rps = data.replies || [];
    return `
    <div class="rs-category" data-cat="${key}" data-mode="${mode}">
      <div class="rs-category-header">
        <div class="rs-category-name">
          ${label}
          <span class="badge">${kws.length} 词 · ${rps.length} 条</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="rs-del-category" data-cat="${key}" title="删除分类">删除</button>
          <div class="rs-category-toggle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
        </div>
      </div>
      <div class="rs-category-body">
        <div class="rs-section-label">关键词</div>
        <div class="rs-chips" data-field="keywords">${renderChips(kws, 'kw')}</div>
        <div class="rs-add-row">
          <input class="rs-add-input" data-field="keywords" placeholder="输入新关键词…">
          <button class="rs-add-btn" data-field="keywords">添加</button>
        </div>
        <div class="rs-section-label" style="margin-top:14px">回复语料</div>
        <div class="rs-chips" data-field="replies">${renderChips(rps, 'rp')}</div>
        <div class="rs-add-row">
          <input class="rs-add-input" data-field="replies" placeholder="输入新回复…">
          <button class="rs-add-btn" data-field="replies">添加</button>
        </div>
      </div>
    </div>`;
  }

  function buildFallbackCard(key, label, items, mode) {
    return `
    <div class="rs-category" data-cat="${key}" data-mode="${mode}">
      <div class="rs-category-header">
        <div class="rs-category-name">${label} <span class="badge">${items.length} 条</span></div>
        <div class="rs-category-toggle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
      </div>
      <div class="rs-category-body">
        <div class="rs-chips" data-field="replies">${renderChips(items, 'rp')}</div>
        <div class="rs-add-row">
          <input class="rs-add-input" data-field="replies" placeholder="输入新回复…">
          <button class="rs-add-btn" data-field="replies">添加</button>
        </div>
      </div>
    </div>`;
  }

  function renderFragmentSettings() {
    const container = document.getElementById('rsFragmentContent');
    let html = '';
    for (const [key, data] of Object.entries(REPLY_RULES)) {
      const label = FRAGMENT_CATEGORY_LABELS[key] || ('🏷️ ' + key);
      html += buildCategoryCard(key, label, data, 'fragment');
    }
    // Fallback pools
    html += buildFallbackCard('_default', FRAGMENT_CATEGORY_LABELS._default, DEFAULT_REPLIES, 'fragment');
    html += buildFallbackCard('_latenight', FRAGMENT_CATEGORY_LABELS._latenight, LATE_NIGHT_REPLIES, 'fragment');
    html += buildFallbackCard('_busyday', FRAGMENT_CATEGORY_LABELS._busyday, BUSY_DAY_REPLIES, 'fragment');
    // New category
    html += `<div class="rs-new-category">
      <button class="rs-new-category-btn" data-mode="fragment">＋ 新增场景分类</button>
    </div>`;
    // Reset
    html += `<div class="rs-footer-actions">
      <button class="rs-reset-btn" data-mode="fragment">恢复默认规则</button>
    </div>`;
    container.innerHTML = html;
  }

  function renderTravelSettings() {
    const container = document.getElementById('rsTravelContent');
    let html = '';
    for (const [key, data] of Object.entries(TRAVEL_REPLY_RULES)) {
      const label = TRAVEL_CATEGORY_LABELS[key] || ('🏷️ ' + key);
      html += buildCategoryCard(key, label, data, 'travel');
    }
    html += buildFallbackCard('_default', TRAVEL_CATEGORY_LABELS._default, TRAVEL_DEFAULT_REPLIES, 'travel');
    html += buildFallbackCard('_done', TRAVEL_CATEGORY_LABELS._done, TRAVEL_DONE_REPLIES, 'travel');
    html += buildFallbackCard('_image', TRAVEL_CATEGORY_LABELS._image, TRAVEL_IMAGE_UPLOAD_REPLIES, 'travel');
    html += `<div class="rs-new-category">
      <button class="rs-new-category-btn" data-mode="travel">＋ 新增场景分类</button>
    </div>`;
    html += `<div class="rs-footer-actions">
      <button class="rs-reset-btn" data-mode="travel">恢复默认规则</button>
    </div>`;
    container.innerHTML = html;
  }

  // Get the underlying array for a fallback key
  function getFallbackArray(mode, cat) {
    if (mode === 'fragment') {
      if (cat === '_default') return DEFAULT_REPLIES;
      if (cat === '_latenight') return LATE_NIGHT_REPLIES;
      if (cat === '_busyday') return BUSY_DAY_REPLIES;
    } else {
      if (cat === '_default') return TRAVEL_DEFAULT_REPLIES;
      if (cat === '_done') return TRAVEL_DONE_REPLIES;
      if (cat === '_image') return TRAVEL_IMAGE_UPLOAD_REPLIES;
    }
    return null;
  }

  function getRulesObj(mode) {
    return mode === 'fragment' ? REPLY_RULES : TRAVEL_REPLY_RULES;
  }

  function saveRules(mode) {
    if (mode === 'fragment') saveFragmentRules();
    else saveTravelRules();
  }

  function renderSettings(mode) {
    if (mode === 'fragment') renderFragmentSettings();
    else renderTravelSettings();
  }

  // Open / Close
  function openReplySettings() {
    renderFragmentSettings();
    renderTravelSettings();
    document.getElementById('replySettingsOverlay').classList.add('active');
    document.getElementById('replySettingsPanel').classList.add('active');
  }

  function closeReplySettings() {
    document.getElementById('replySettingsOverlay').classList.remove('active');
    document.getElementById('replySettingsPanel').classList.remove('active');
  }

  // Event delegation for the settings panel
  document.getElementById('replySettingsBtn').addEventListener('click', openReplySettings);
  document.getElementById('rsCloseBtn').addEventListener('click', closeReplySettings);
  document.getElementById('replySettingsOverlay').addEventListener('click', closeReplySettings);

  // Tab switching
  document.querySelector('.rs-tab-bar').addEventListener('click', (e) => {
    const tab = e.target.closest('.rs-tab');
    if (!tab) return;
    document.querySelectorAll('.rs-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.rs-tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.rsTab;
    document.getElementById(target === 'fragment' ? 'rsFragmentContent' : 'rsTravelContent').classList.add('active');
  });

  // Event delegation for category actions
  document.getElementById('replySettingsPanel').addEventListener('click', (e) => {
    // Toggle expand/collapse
    const header = e.target.closest('.rs-category-header');
    if (header && !e.target.closest('.rs-del-category')) {
      header.closest('.rs-category').classList.toggle('expanded');
      return;
    }

    // Delete chip
    const chipDel = e.target.closest('.chip-del');
    if (chipDel) {
      const idx = parseInt(chipDel.dataset.idx);
      const chipsContainer = chipDel.closest('.rs-chips');
      const field = chipsContainer.dataset.field;
      const catEl = chipDel.closest('.rs-category');
      const cat = catEl.dataset.cat;
      const mode = catEl.dataset.mode;

      if (cat.startsWith('_')) {
        // Fallback array
        const arr = getFallbackArray(mode, cat);
        if (arr && idx >= 0 && idx < arr.length) {
          arr.splice(idx, 1);
          saveRules(mode);
          renderSettings(mode);
        }
      } else {
        const rules = getRulesObj(mode);
        if (rules[cat] && rules[cat][field]) {
          rules[cat][field].splice(idx, 1);
          saveRules(mode);
          renderSettings(mode);
        }
      }
      return;
    }

    // Add button
    const addBtn = e.target.closest('.rs-add-btn');
    if (addBtn) {
      const row = addBtn.closest('.rs-add-row');
      const input = row.querySelector('.rs-add-input');
      const value = (input.value || '').trim();
      if (!value) { input.focus(); return; }
      const field = addBtn.dataset.field;
      const catEl = addBtn.closest('.rs-category');
      const cat = catEl.dataset.cat;
      const mode = catEl.dataset.mode;

      if (cat.startsWith('_')) {
        const arr = getFallbackArray(mode, cat);
        if (arr) { arr.push(value); saveRules(mode); renderSettings(mode); }
      } else {
        const rules = getRulesObj(mode);
        if (rules[cat]) {
          if (!rules[cat][field]) rules[cat][field] = [];
          rules[cat][field].push(value);
          saveRules(mode);
          renderSettings(mode);
        }
      }
      return;
    }

    // Delete category
    const delCatBtn = e.target.closest('.rs-del-category');
    if (delCatBtn) {
      const cat = delCatBtn.dataset.cat;
      const catEl = delCatBtn.closest('.rs-category');
      const mode = catEl.dataset.mode;
      if (cat.startsWith('_')) return; // Can't delete fallback pools
      if (!confirm(`确定删除「${cat}」分类？删除后关键词和回复都会丢失。`)) return;
      const rules = getRulesObj(mode);
      delete rules[cat];
      saveRules(mode);
      renderSettings(mode);
      return;
    }

    // New category
    const newCatBtn = e.target.closest('.rs-new-category-btn');
    if (newCatBtn) {
      const mode = newCatBtn.dataset.mode;
      const name = prompt('请输入新场景分类名（英文 key，如 onsen）：');
      if (!name || !name.trim()) return;
      const key = name.trim().toLowerCase().replace(/\s+/g, '_');
      const rules = getRulesObj(mode);
      if (rules[key]) { alert('该分类已存在'); return; }
      rules[key] = { keywords: [], replies: [] };
      saveRules(mode);
      renderSettings(mode);
      return;
    }

    // Reset
    const resetBtn = e.target.closest('.rs-reset-btn');
    if (resetBtn) {
      const mode = resetBtn.dataset.mode;
      if (!confirm('确定恢复默认规则？所有自定义修改将丢失。')) return;
      if (mode === 'fragment') {
        REPLY_RULES = JSON.parse(JSON.stringify(FRAGMENT_RULES_DEFAULT));
        DEFAULT_REPLIES.splice(0, DEFAULT_REPLIES.length, ...FRAGMENT_DEFAULT_REPLIES_DEFAULT);
        LATE_NIGHT_REPLIES.splice(0, LATE_NIGHT_REPLIES.length, ...FRAGMENT_LATENIGHT_DEFAULT);
        BUSY_DAY_REPLIES.splice(0, BUSY_DAY_REPLIES.length, ...FRAGMENT_BUSYDAY_DEFAULT);
        localStorage.removeItem(RS_FRAGMENT_KEY);
      } else {
        TRAVEL_REPLY_RULES = JSON.parse(JSON.stringify(TRAVEL_RULES_DEFAULT));
        TRAVEL_DEFAULT_REPLIES.splice(0, TRAVEL_DEFAULT_REPLIES.length, ...TRAVEL_DEFAULT_REPLIES_DEFAULT);
        TRAVEL_DONE_REPLIES.splice(0, TRAVEL_DONE_REPLIES.length, ...TRAVEL_DONE_REPLIES_DEFAULT);
        TRAVEL_IMAGE_UPLOAD_REPLIES.splice(0, TRAVEL_IMAGE_UPLOAD_REPLIES.length, ...TRAVEL_IMAGE_UPLOAD_REPLIES_DEFAULT);
        localStorage.removeItem(RS_TRAVEL_KEY);
      }
      renderSettings(mode);
      return;
    }
  });

  // Allow Enter key to submit in add inputs
  document.getElementById('replySettingsPanel').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.classList.contains('rs-add-input')) {
      e.preventDefault();
      const row = e.target.closest('.rs-add-row');
      const btn = row.querySelector('.rs-add-btn');
      if (btn) btn.click();
    }
  });

  /* ============================
     Init
     ============================ */
  function init() {
    loadReplyRulesFromStorage();
    loadRecords();
    migrateReplies();
    renderTimeline();
    updateStreak();
    registerPWA();
    loadTrips();
    renderTravelList();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
