<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的碎片">
<meta name="theme-color" content="#FAF6F0">
<title>我的碎片</title>
<meta name="robots" content="noindex, nofollow">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================
   CSS Variables & Design Tokens
   ============================================ */
:root {
  --bg-page: #FAF6F0;
  --bg-card: #FFFAF5;
  --bg-input: #FFF8F0;
  --bg-hover: #F5EDE3;
  --bg-overlay: rgba(61, 48, 41, 0.45);

  --primary: #D2691E;
  --primary-light: #E8A87C;
  --primary-soft: #F5DCC8;
  --accent-blue: #3A5A8C;
  --accent-blue-light: #7BA7CC;
  --accent-blue-soft: #D6E5F3;

  --text-primary: #3D3029;
  --text-secondary: #8C7B6B;
  --text-tertiary: #B0A090;
  --text-inverse: #FFFAF5;

  --danger: #C0392B;
  --danger-soft: #FADBD8;
  --success: #4CAF50;

  --shadow-sm: 0 1px 3px rgba(61, 48, 41, 0.06);
  --shadow-md: 0 4px 16px rgba(61, 48, 41, 0.08);
  --shadow-lg: 0 8px 32px rgba(61, 48, 41, 0.1);
  --shadow-card: 0 2px 12px rgba(61, 48, 41, 0.06), 0 0 0 1px rgba(61, 48, 41, 0.03);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  --font-display: 'Noto Serif SC', 'PingFang SC', 'Hiragino Sans GB', serif;
  --font-body: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', -apple-system, sans-serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tab-bar-height: 56px;
}

/* ============================================
   Reset & Base
   ============================================ */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-primary);
  background: var(--bg-page);
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(72px + var(--safe-bottom));
  overscroll-behavior-y: none;
}

/* 背景纹理 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: 
    radial-gradient(ellipse at 20% 10%, rgba(232, 168, 124, 0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(123, 167, 204, 0.08) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   Scrollbar
   ============================================ */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-tertiary); border-radius: 2px; }

/* ============================================
   Layout Container
   ============================================ */
.app-container {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ============================================
   Top Navigation Bar
   ============================================ */
.nav-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: calc(12px + var(--safe-top)) 20px 12px;
  margin: 0 -16px;
  background: rgba(250, 246, 240, 0.82);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(61, 48, 41, 0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 1px;
}

.nav-title span {
  color: var(--primary);
}

.nav-actions {
  display: flex;
  gap: 4px;
}

.nav-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.nav-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-btn:active { transform: scale(0.92); }

.nav-btn svg { width: 20px; height: 20px; }

/* ============================================
   Streak Card
   ============================================ */
.streak-card {
  margin-top: 20px;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 24px;
  box-shadow: var(--shadow-card);
  display: flex;
  gap: 24px;
  align-items: center;
  animation: fadeInDown 0.5s ease-out;
}

.streak-info {
  flex-shrink: 0;
  text-align: center;
  min-width: 90px;
}

.streak-number {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1;
  margin-bottom: 4px;
}

.streak-label {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
  letter-spacing: 0.5px;
}

.streak-emoji {
  font-size: 18px;
  display: block;
  margin-top: 6px;
}

.heatmap-section {
  flex: 1;
  min-width: 0;
}

.heatmap-label {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-bottom: 8px;
  font-weight: 500;
  letter-spacing: 0.3px;
}

.heatmap-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 4px;
}

.heatmap-cell {
  aspect-ratio: 1;
  border-radius: 4px;
  background: #F0E8DD;
  transition: background 0.3s;
  position: relative;
}

.heatmap-cell.has-record {
  background: var(--cell-color, var(--primary));
}

.heatmap-cell.is-today {
  box-shadow: 0 0 0 2px var(--accent-blue-light);
}

.heatmap-cell.is-today.has-record {
  box-shadow: 0 0 0 2px var(--primary);
}

/* ============================================
   Composer (Input Area)
   ============================================ */
.composer {
  margin-top: 20px;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 20px;
  box-shadow: var(--shadow-card);
  transition: box-shadow 0.3s;
}

.composer:focus-within {
  box-shadow: var(--shadow-md), 0 0 0 2px var(--primary-soft);
}

.composer-textarea {
  width: 100%;
  min-height: 80px;
  max-height: 200px;
  border: none;
  outline: none;
  resize: none;
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-primary);
  background: transparent;
  overflow-y: auto;
}

.composer-textarea::placeholder {
  color: var(--text-tertiary);
}

.composer-divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(61, 48, 41, 0.08), transparent);
  margin: 12px 0;
}

/* 图片预览区 */
.composer-previews {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.composer-previews:empty {
  display: none;
  margin-bottom: 0;
}

.preview-item {
  position: relative;
  width: 72px;
  height: 72px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  animation: fadeIn 0.3s ease;
}

.preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.preview-remove {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: none;
  background: rgba(61, 48, 41, 0.6);
  color: white;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  line-height: 1;
}

/* 底部操作栏 */
.composer-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.composer-tools {
  display: flex;
  gap: 4px;
}

.tool-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 38px;
  padding: 0 12px;
  border: none;
  border-radius: var(--radius-full);
  background: var(--bg-input);
  color: var(--text-secondary);
  font-size: 13px;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.tool-btn svg { width: 18px; height: 18px; }

.tool-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.tool-btn:active { transform: scale(0.95); }

.publish-btn {
  height: 40px;
  padding: 0 24px;
  border: none;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, var(--primary), #B85A18);
  color: var(--text-inverse);
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.25s;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: 1px;
}

.publish-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(210, 105, 30, 0.3); }
.publish-btn:active { transform: scale(0.96); }
.publish-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

#imageInput { display: none; }

/* ============================================
   Search Bar
   ============================================ */
.search-bar {
  margin-top: 20px;
  position: relative;
}

.search-bar svg {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--text-tertiary);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: 44px;
  padding: 0 16px 0 42px;
  border: 1px solid rgba(61, 48, 41, 0.06);
  border-radius: var(--radius-full);
  background: var(--bg-card);
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--text-primary);
  outline: none;
  transition: all 0.2s;
}

.search-input::placeholder { color: var(--text-tertiary); }
.search-input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px var(--primary-soft); }

.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: var(--bg-hover);
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
}

.search-clear.visible { display: flex; }

/* ============================================
   Timeline
   ============================================ */
.timeline {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.timeline-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
  font-size: 14px;
}

.timeline-empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  display: block;
  opacity: 0.6;
}

/* Record Card */
.record-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-card);
  position: relative;
  animation: fadeInUp 0.4s ease-out both;
}

.record-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.record-time {
  font-size: 12px;
  color: var(--accent-blue-light);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
}

.record-time svg {
  width: 13px;
  height: 13px;
}

.record-delete {
  width: 32px;
  height: 32px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.record-delete svg { width: 16px; height: 16px; }
.record-delete:hover { background: var(--danger-soft); color: var(--danger); }
.record-delete:active { transform: scale(0.9); }

.record-text {
  font-size: 15px;
  line-height: 1.8;
  color: var(--text-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

/* 图片网格 */
.record-images {
  margin-top: 12px;
  display: grid;
  gap: 8px;
  border-radius: var(--radius-md);
  overflow: hidden;
}

.record-images.cols-1 { grid-template-columns: 1fr; }
.record-images.cols-2 { grid-template-columns: 1fr 1fr; }
.record-images.cols-3 { grid-template-columns: 1fr 1fr 1fr; }

.record-images img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: transform 0.2s, opacity 0.2s;
  background: var(--bg-hover);
}

.record-images img:hover { opacity: 0.9; }
.record-images.cols-1 img { aspect-ratio: 16/10; max-height: 280px; }

/* ============================================
   Modal (Delete Confirmation & Image Preview)
   ============================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: var(--bg-overlay);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  visibility: hidden;
  transition: all 0.25s;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-box {
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 28px 24px 20px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  transform: scale(0.9) translateY(10px);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.active .modal-box {
  transform: scale(1) translateY(0);
}

.modal-icon {
  font-size: 40px;
  margin-bottom: 12px;
  display: block;
}

.modal-title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.modal-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 24px;
  line-height: 1.6;
}

.modal-actions {
  display: flex;
  gap: 12px;
}

.modal-actions button {
  flex: 1;
  height: 44px;
  border: none;
  border-radius: var(--radius-md);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.btn-cancel {
  background: var(--bg-hover);
  color: var(--text-secondary);
}

.btn-cancel:hover { background: #E8DFD4; }

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-danger:hover { background: #A93226; }
.btn-danger:active, .btn-cancel:active { transform: scale(0.96); }

/* Image Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 1001;
  background: rgba(0, 0, 0, 0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s;
  cursor: zoom-out;
}

.lightbox.active { opacity: 1; visibility: visible; }

.lightbox img {
  max-width: 92vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: var(--radius-sm);
  transform: scale(0.9);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.lightbox.active img { transform: scale(1); }

/* ============================================
   Animations
   ============================================ */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ============================================
   Toast
   ============================================ */
.toast {
  position: fixed;
  bottom: calc(var(--tab-bar-height) + 24px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 10px 20px;
  background: var(--text-primary);
  color: var(--text-inverse);
  border-radius: var(--radius-full);
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 2000;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

/* ============================================
   Light Reply (轻回复) 样式
   ============================================ */
.light-reply {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(61, 48, 41, 0.06);
  display: flex;
  align-items: flex-start;
  gap: 10px;
  animation: fadeIn 0.4s ease both;
}

.light-reply-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  /* 备用 SVG 占位头像 */
  background: var(--bg-hover);
}

.light-reply-content {
  flex: 1;
  min-width: 0;
}

.light-reply-header {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 2px;
}

.light-reply-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1;
}

.light-reply-handle {
  font-size: 11px;
  color: var(--text-tertiary);
  line-height: 1;
}

.light-reply-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* 行前提示横幅（嵌入行程条卡片顶部） */
.itinerary-pre-hint {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px 9px;
  background: rgba(210, 105, 30, 0.06);
  border-top: 2.5px solid var(--primary);
  margin: -12px -16px 10px -16px;
  width: calc(100% + 32px);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  animation: fadeIn 0.4s ease both;
  position: relative;
}
.itinerary-pre-hint::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 3%;
  right: 3%;
  height: 0.5px;
  background: rgba(210, 105, 30, 0.13);
}
.itinerary-pre-hint .hint-avatar {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  opacity: 0.85;
  margin-top: 1px;
}
.itinerary-pre-hint .hint-body {
  flex: 1;
  min-width: 0;
}
.itinerary-pre-hint .hint-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--primary);
  line-height: 1;
  margin-bottom: 2px;
}
.itinerary-pre-hint .hint-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.4;
}

/* 行程完成后帖子回复（行程条下方） */
.itinerary-post-reply {
  margin-left: 34px;
  margin-top: 4px;
  padding: 8px 12px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: flex-start;
  gap: 8px;
  animation: fadeIn 0.4s ease both;
}
.itinerary-post-reply .reply-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}
.itinerary-post-reply .reply-body {
  flex: 1;
  min-width: 0;
}
.itinerary-post-reply .reply-header {
  display: flex;
  align-items: baseline;
  gap: 5px;
  margin-bottom: 2px;
}
.itinerary-post-reply .reply-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1;
}
.itinerary-post-reply .reply-handle {
  font-size: 11px;
  color: var(--text-tertiary);
  line-height: 1;
}
.itinerary-post-reply .reply-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 520px) {
  .app-container { padding: 0 12px; }
  .nav-bar { margin: 0 -12px; padding-left: 16px; padding-right: 16px; }
  .streak-card { padding: 18px; gap: 16px; flex-direction: column; align-items: stretch; }
  .streak-info { display: flex; align-items: center; gap: 12px; min-width: auto; text-align: left; }
  .streak-number { font-size: 36px; }
  .streak-emoji { display: inline; margin-top: 0; margin-left: 4px; }
}

@media (min-width: 521px) {
  .app-container { padding: 0 24px; }
}

/* ============================================
   Bottom Tab Bar
   ============================================ */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 500;
  height: calc(var(--tab-bar-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(255, 250, 245, 0.92);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-top: 1px solid rgba(61, 48, 41, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
}

.tab-item {
  flex: 1;
  max-width: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  height: var(--tab-bar-height);
  border: none;
  background: transparent;
  color: var(--text-tertiary);
  font-size: 11px;
  font-family: var(--font-body);
  font-weight: 500;
  cursor: pointer;
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.tab-item svg { width: 22px; height: 22px; }
.tab-item.active { color: var(--primary); }
.tab-item:active { transform: scale(0.92); }

/* Page Sections */
.page-section { display: none; }
.page-section.active { display: block; }

/* ============================================
   Travel Module
   ============================================ */
.travel-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: calc(12px + var(--safe-top)) 20px 12px;
  margin: 0 -16px;
  background: rgba(250, 246, 240, 0.82);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(61, 48, 41, 0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.travel-nav-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
}
.travel-nav-title span { color: var(--primary); }

.travel-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-tertiary);
}
.travel-empty-icon { font-size: 56px; margin-bottom: 16px; display: block; }

.travel-action-btns {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 16px;
}

.travel-action-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 44px;
  padding: 0 20px;
  border: none;
  border-radius: var(--radius-full);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.travel-action-btn.primary {
  background: linear-gradient(135deg, var(--primary), #B85A18);
  color: var(--text-inverse);
}
.travel-action-btn.primary:hover { box-shadow: 0 4px 12px rgba(210, 105, 30, 0.3); }
.travel-action-btn:active { transform: scale(0.95); }

/* Trip card */
.trip-card {
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 20px;
  box-shadow: var(--shadow-card);
  margin-top: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.trip-card { position: relative; }
.trip-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.trip-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.trip-card-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--text-primary); flex: 1; }
.trip-card-date { font-size: 12px; color: var(--text-tertiary); }
.trip-card-route { font-size: 13px; color: var(--text-secondary); }
.trip-delete-btn {
  position: absolute; top: 12px; right: 12px;
  width: 28px; height: 28px; border-radius: 50%;
  background: transparent; border: none; cursor: pointer;
  color: var(--text-tertiary); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; z-index: 2; opacity: 0;
}
.trip-card:hover .trip-delete-btn { opacity: 1; }
.trip-delete-btn:hover { background: var(--danger-soft); color: var(--danger); }

/* Trip detail */
.trip-detail { display: none; }
.trip-detail.active { display: block; }

.trip-detail-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  margin: 0 -16px;
  background: rgba(250, 246, 240, 0.82);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid rgba(61, 48, 41, 0.06);
  display: flex;
  align-items: center;
  gap: 12px;
}

.trip-back-btn {
  width: 36px; height: 36px; border: none; border-radius: var(--radius-md);
  background: transparent; color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.trip-back-btn:hover { background: var(--bg-hover); }
.trip-back-btn svg { width: 20px; height: 20px; }

.trip-detail-title {
  flex: 1;
  font-family: var(--font-display);
  font-size: 18px; font-weight: 600; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.trip-refresh-btn {
  width: 36px; height: 36px; border: none; border-radius: var(--radius-md);
  background: transparent; color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.trip-refresh-btn:hover { background: var(--bg-hover); }
.trip-refresh-btn svg { width: 18px; height: 18px; }

/* Flight card */
.flight-card {
  margin-top: 16px;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 16px 20px;
  box-shadow: var(--shadow-card);
}
.flight-card-title { font-size: 13px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 10px; }
.flight-segment { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.flight-segment + .flight-segment { border-top: 1px dashed rgba(61, 48, 41, 0.08); }
.flight-icon { font-size: 20px; flex-shrink: 0; }
.flight-info { flex: 1; }
.flight-route { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.flight-meta { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

/* Hotel timeline */
.hotel-timeline {
  margin-top: 12px;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 16px 20px;
  box-shadow: var(--shadow-card);
}
.hotel-timeline-title { font-size: 13px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 10px; }
.hotel-bar { display: flex; gap: 6px; }
.hotel-item {
  flex: 1;
  background: var(--primary-soft);
  border-radius: var(--radius-md);
  padding: 10px 12px;
}
.hotel-item-date { font-size: 11px; color: var(--primary); font-weight: 600; }
.hotel-item-name { font-size: 13px; color: var(--text-primary); font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hotel-item-price { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* Day tabs */
.day-tabs {
  margin-top: 16px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  flex-shrink: 0;
  height: 34px; padding: 0 14px;
  border: 1px solid rgba(61, 48, 41, 0.1);
  border-radius: var(--radius-full);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 13px; font-weight: 500; font-family: var(--font-body);
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.day-tab.active { background: var(--primary); color: var(--text-inverse); border-color: var(--primary); }

/* Day panel */
.day-content { margin-top: 12px; }
.day-panel { display: none; }
.day-panel.active { display: block; animation: fadeIn 0.3s ease; }

/* Checkpoint */
.checkpoint-list { display: flex; flex-direction: column; gap: 8px; }
.checkpoint-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; background: var(--bg-card); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.checkpoint-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--text-tertiary); flex-shrink: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s; margin-top: 2px;
}
.checkpoint-check.checked { border-color: var(--success); background: var(--success); color: white; }
.checkpoint-check.checked::after { content: '\2713'; font-size: 12px; font-weight: bold; }
.checkpoint-check.skipped { border-color: var(--text-tertiary); background: var(--bg-hover); color: var(--text-tertiary); }
.checkpoint-check.skipped::after { content: '⊘'; font-size: 11px; }
.checkpoint-info { flex: 1; min-width: 0; }
.checkpoint-time { font-size: 11px; color: var(--accent-blue-light); font-weight: 500; }
.checkpoint-name { font-size: 14px; color: var(--text-primary); font-weight: 500; }
.checkpoint-name.done { text-decoration: line-through; color: var(--text-tertiary); }
.checkpoint-name.skipped { text-decoration: line-through; color: var(--text-tertiary); }
.checkpoint-detail { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.checkpoint-jp { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }
.checkpoint-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; margin-top: 2px; }
.checkpoint-skip-btn, .checkpoint-delete-btn {
  width: 22px; height: 22px; border: none; border-radius: 50%;
  background: transparent; color: var(--text-tertiary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: all 0.2s;
}
.checkpoint-skip-btn:hover { background: var(--bg-hover); color: var(--text-secondary); }
.checkpoint-delete-btn:hover { background: var(--danger-soft); color: var(--danger); }

/* Sub Tabs */
.sub-tabs {
  margin-top: 20px; display: flex; border-bottom: 1px solid rgba(61, 48, 41, 0.08);
}
.sub-tab {
  flex: 1; height: 40px; border: none; background: transparent;
  color: var(--text-tertiary); font-size: 13px; font-weight: 500; font-family: var(--font-body);
  cursor: pointer; position: relative; transition: color 0.2s;
}
.sub-tab.active { color: var(--primary); }
.sub-tab.active::after {
  content: ''; position: absolute; bottom: -1px; left: 20%; right: 20%;
  height: 2px; background: var(--primary); border-radius: 1px;
}
.sub-content { margin-top: 12px; min-height: 100px; }
.sub-panel { display: none; }
.sub-panel.active { display: block; animation: fadeIn 0.3s ease; }

/* Checklist */
.checklist-list { display: flex; flex-direction: column; gap: 6px; }
.checklist-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg-card); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
.checklist-cb {
  width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--text-tertiary);
  flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.checklist-cb.checked { border-color: var(--success); background: var(--success); color: white; }
.checklist-cb.checked::after { content: '\2713'; font-size: 11px; font-weight: bold; }
.checklist-text { font-size: 14px; color: var(--text-primary); flex: 1; }
.checklist-text.done { text-decoration: line-through; color: var(--text-tertiary); }

/* Lookup table */
.lookup-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  background: var(--bg-card); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm);
}
.lookup-table th { background: var(--bg-hover); padding: 8px 10px; font-size: 12px; font-weight: 600; color: var(--text-secondary); text-align: left; }
.lookup-table td { padding: 8px 10px; font-size: 13px; color: var(--text-primary); border-top: 1px solid rgba(61, 48, 41, 0.05); }
.lookup-del-btn {
  background: none; border: none; color: var(--text-tertiary); font-size: 16px; cursor: pointer;
  padding: 2px 6px; border-radius: 4px; opacity: 0.4; transition: all 0.2s;
}
.lookup-del-btn:hover { opacity: 1; color: #c0392b; background: rgba(192,57,43,0.08); }
.lookup-btn-row { display: flex; gap: 8px; margin-top: 8px; }
.lookup-btn-row .add-item-btn { flex: 1; }

/* Add item button */
.add-item-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; height: 40px; margin-top: 12px;
  border: 1px dashed rgba(61, 48, 41, 0.15); border-radius: var(--radius-md);
  background: transparent; color: var(--text-tertiary); font-size: 13px; font-family: var(--font-body); cursor: pointer; transition: all 0.2s;
}
.add-item-btn:hover { border-color: var(--primary-light); color: var(--primary); background: var(--primary-soft); }

/* ============================================
   Transport Panel (折叠)
   ============================================ */
.transport-panel {
  margin-top: 12px;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.transport-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; cursor: pointer; transition: background 0.2s;
}
.transport-header:hover { background: var(--bg-hover); }
.transport-header-title { font-size: 13px; color: var(--text-tertiary); font-weight: 500; }
.transport-toggle { font-size: 12px; color: var(--text-tertiary); transition: transform 0.3s; }
.transport-panel.open .transport-toggle { transform: rotate(180deg); }
.transport-body { padding: 0 20px; max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s; }
.transport-panel.open .transport-body { max-height: 2000px; padding: 0 20px 16px; }
.transport-section { margin-bottom: 14px; }
.transport-section-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
.transport-table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: var(--radius-sm); overflow: hidden; }
.transport-table th { background: var(--bg-hover); padding: 6px 10px; font-size: 11px; font-weight: 600; color: var(--text-secondary); text-align: left; }
.transport-table td { padding: 6px 10px; font-size: 12px; color: var(--text-primary); border-top: 1px solid rgba(61, 48, 41, 0.05); }
.transport-tip { font-size: 11px; color: var(--accent-blue); background: var(--accent-blue-soft); padding: 6px 10px; border-radius: var(--radius-sm); margin-top: 6px; }

/* ============================================
   Hotel Detail Card (enhanced)
   ============================================ */
.hotel-detail-card {
  margin-top: 12px;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 16px 20px;
  box-shadow: var(--shadow-card);
}
.hotel-detail-card-title { font-size: 13px; color: var(--text-tertiary); font-weight: 500; margin-bottom: 12px; }
.hotel-detail-item {
  background: var(--primary-soft);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 10px;
  position: relative;
}
.hotel-detail-item:last-child { margin-bottom: 0; }
.hotel-detail-date { font-size: 11px; color: var(--primary); font-weight: 600; margin-bottom: 4px; }
.hotel-detail-name { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.hotel-detail-namejp { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.hotel-detail-romaji { font-size: 11px; color: var(--text-tertiary); }
.hotel-detail-address { font-size: 12px; color: var(--text-secondary); margin-top: 6px; display: flex; align-items: flex-start; gap: 4px; }
.hotel-detail-meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }
.hotel-detail-meta span { display: flex; align-items: center; gap: 3px; }
.hotel-detail-features { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.hotel-detail-features .tag { font-size: 10px; padding: 2px 8px; background: rgba(210, 105, 30, 0.1); color: var(--primary); border-radius: var(--radius-full); }
.hotel-detail-images { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
.hotel-detail-images img { width: 60px; height: 60px; border-radius: var(--radius-sm); object-fit: cover; cursor: pointer; }
.hotel-upload-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--primary); cursor: pointer; margin-top: 8px;
  padding: 4px 10px; background: rgba(210, 105, 30, 0.08); border-radius: var(--radius-full);
  border: none; font-family: var(--font-body); transition: all 0.2s;
}
.hotel-upload-btn:hover { background: rgba(210, 105, 30, 0.15); }
.hotel-edit-btn {
  position: absolute; top: 10px; right: 10px;
  width: 26px; height: 26px; border: none; border-radius: 50%;
  background: rgba(255,255,255,0.8); color: var(--text-secondary);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all 0.2s;
}
.hotel-edit-btn:hover { background: var(--primary-soft); color: var(--primary); }

/* ============================================
   Attachment (攻略缩略条)
   ============================================ */
.checkpoint-attachments { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }

/* Checkin card (打卡卡片) */
.checkin-card {
  display: flex; flex-direction: column; gap: 8px;
  padding: 14px 16px; border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--bg-card) 85%, var(--primary) 15%);
  border-left: 3px solid var(--primary);
  box-shadow: var(--shadow-sm);
  position: relative;
}
.checkin-card-header { display: flex; align-items: center; gap: 8px; }
.checkin-card-badge {
  font-size: 10px; font-weight: 600; color: var(--primary);
  background: var(--primary-soft); padding: 2px 8px; border-radius: 10px;
  letter-spacing: 0.5px; flex-shrink: 0;
}
.checkin-card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.checkin-card-meta { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); }
.checkin-card-meta span::before { margin-right: 4px; }
.checkin-card-content { font-size: 13px; color: var(--text-primary); line-height: 1.6; white-space: pre-wrap; }
.checkin-card-images { display: flex; flex-wrap: wrap; gap: 6px; }
.checkin-card-images img { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; cursor: pointer; }
.checkin-card-actions {
  position: absolute; top: 8px; right: 8px;
  display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s;
}
.checkin-card:hover .checkin-card-actions { opacity: 1; }
.checkin-card-actions button {
  background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px; color: var(--text-tertiary);
}
.checkin-card-actions button:hover { background: var(--bg-hover); color: var(--danger); }
.attachment-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; background: var(--bg-input); border-radius: var(--radius-sm);
  cursor: pointer; transition: background 0.2s;
}
.attachment-bar:hover { background: var(--bg-hover); }
.attachment-bar-icon { font-size: 12px; flex-shrink: 0; }
.attachment-bar-title { font-size: 12px; font-weight: 500; color: var(--text-primary); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attachment-bar-preview { font-size: 11px; color: var(--text-tertiary); max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attachment-bar-thumb { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
.checkpoint-add-btn {
  width: 24px; height: 24px; border: 1px dashed var(--text-tertiary); border-radius: 50%;
  background: transparent; color: var(--text-tertiary); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all 0.2s; margin-top: 2px;
}
.checkpoint-add-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

/* ============================================
   Form Modal (编辑弹窗)
   ============================================ */
.form-modal-overlay {
  position: fixed; inset: 0; z-index: 1002;
  background: var(--bg-overlay);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.25s;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.form-modal-overlay.active { opacity: 1; visibility: visible; }
.form-modal-box {
  background: var(--bg-card); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 24px 20px calc(20px + var(--safe-bottom));
  width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto;
  transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.form-modal-overlay.active .form-modal-box { transform: translateY(0); }
.form-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.form-modal-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--text-primary); }
.form-modal-close { width: 32px; height: 32px; border: none; border-radius: 50%; background: var(--bg-hover); color: var(--text-secondary); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; display: block; }
.form-input {
  width: 100%; height: 40px; padding: 0 12px; border: 1px solid rgba(61, 48, 41, 0.1);
  border-radius: var(--radius-sm); background: var(--bg-input); font-size: 14px;
  color: var(--text-primary); font-family: var(--font-body); outline: none; transition: border-color 0.2s;
}
.form-input:focus { border-color: var(--primary-light); }
.form-textarea {
  width: 100%; min-height: 100px; padding: 10px 12px; border: 1px solid rgba(61, 48, 41, 0.1);
  border-radius: var(--radius-sm); background: var(--bg-input); font-size: 14px;
  color: var(--text-primary); font-family: var(--font-body); outline: none; resize: vertical; transition: border-color 0.2s;
}
.form-textarea:focus { border-color: var(--primary-light); }
.form-submit-btn {
  width: 100%; height: 44px; border: none; border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary), #B85A18); color: var(--text-inverse);
  font-size: 15px; font-weight: 600; font-family: var(--font-body); cursor: pointer; transition: all 0.2s;
}
.form-submit-btn:hover { box-shadow: 0 4px 12px rgba(210, 105, 30, 0.3); }
.form-submit-btn:active { transform: scale(0.97); }
.form-image-previews { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.form-image-previews .preview-item { width: 64px; height: 64px; }

/* ============================================
   Reply Settings Panel (回复规则设置)
   ============================================ */
.reply-settings-overlay {
  position: fixed; inset: 0; z-index: 1010;
  background: var(--bg-overlay);
  opacity: 0; visibility: hidden; transition: all 0.3s;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.reply-settings-overlay.active { opacity: 1; visibility: visible; }
.reply-settings-panel {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1011;
  background: var(--bg-card);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  max-height: 88vh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 -4px 24px rgba(61,48,41,0.12);
}
.reply-settings-overlay.active + .reply-settings-panel,
.reply-settings-panel.active { transform: translateY(0); }
.rs-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 14px; border-bottom: 1px solid rgba(61,48,41,0.06); flex-shrink: 0;
}
.rs-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--text-primary); }
.rs-close {
  width: 32px; height: 32px; border: none; border-radius: 50%; background: var(--bg-hover);
  color: var(--text-secondary); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s;
}
.rs-close:hover { background: var(--primary-soft); color: var(--primary); }
.rs-body { flex: 1; overflow-y: auto; padding: 16px 20px calc(20px + var(--safe-bottom)); }

/* Tab switch: 碎片回复 / 旅行回复 */
.rs-tab-bar {
  display: flex; gap: 0; background: var(--bg-hover); border-radius: var(--radius-full);
  padding: 3px; margin-bottom: 16px;
}
.rs-tab {
  flex: 1; height: 34px; border: none; border-radius: var(--radius-full);
  background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 500;
  font-family: var(--font-body); cursor: pointer; transition: all 0.25s;
}
.rs-tab.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-sm); font-weight: 600; }
.rs-tab-content { display: none; }
.rs-tab-content.active { display: block; }

/* Category card */
.rs-category {
  background: var(--bg-page); border-radius: var(--radius-md);
  margin-bottom: 12px; overflow: hidden; border: 1px solid rgba(61,48,41,0.04);
}
.rs-category-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; cursor: pointer; user-select: none; transition: background 0.2s;
}
.rs-category-header:hover { background: var(--bg-hover); }
.rs-category-name {
  font-size: 14px; font-weight: 600; color: var(--text-primary);
  display: flex; align-items: center; gap: 6px;
}
.rs-category-name .badge {
  font-size: 11px; font-weight: 500; color: var(--text-tertiary); background: var(--bg-hover);
  padding: 1px 7px; border-radius: var(--radius-full);
}
.rs-category-toggle {
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); transition: transform 0.25s;
}
.rs-category.expanded .rs-category-toggle { transform: rotate(180deg); }
.rs-category-body { display: none; padding: 0 14px 14px; }
.rs-category.expanded .rs-category-body { display: block; }

/* Section label */
.rs-section-label {
  font-size: 11px; font-weight: 600; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.5px; margin: 10px 0 6px;
}

/* Chips (keywords / replies) */
.rs-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rs-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: var(--radius-full);
  font-size: 12px; color: var(--text-primary); cursor: default;
  transition: all 0.2s; max-width: 100%; position: relative;
}
.rs-chip.kw { background: var(--accent-blue-soft); }
.rs-chip.rp { background: var(--primary-soft); }
.rs-chip .chip-del {
  width: 16px; height: 16px; border: none; border-radius: 50%; background: rgba(61,48,41,0.1);
  color: var(--text-secondary); font-size: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s;
}
.rs-chip .chip-del:hover { background: var(--danger-soft); color: var(--danger); }
.rs-chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }

/* Inline add input */
.rs-add-row { display: flex; gap: 6px; margin-top: 6px; }
.rs-add-input {
  flex: 1; height: 32px; padding: 0 10px; border: 1px dashed rgba(61,48,41,0.15);
  border-radius: var(--radius-full); background: var(--bg-input); font-size: 12px;
  color: var(--text-primary); font-family: var(--font-body); outline: none; transition: border-color 0.2s;
}
.rs-add-input:focus { border-color: var(--primary-light); border-style: solid; }
.rs-add-input::placeholder { color: var(--text-tertiary); }
.rs-add-btn {
  height: 32px; padding: 0 14px; border: none; border-radius: var(--radius-full);
  background: var(--primary); color: var(--text-inverse); font-size: 12px; font-weight: 600;
  font-family: var(--font-body); cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.rs-add-btn:hover { box-shadow: 0 2px 8px rgba(210,105,30,0.25); }
.rs-add-btn:active { transform: scale(0.95); }

/* New category form */
.rs-new-category {
  border: 2px dashed rgba(61,48,41,0.1); border-radius: var(--radius-md);
  padding: 14px; margin-top: 4px;
}
.rs-new-category-btn {
  width: 100%; height: 40px; border: none; border-radius: var(--radius-md);
  background: transparent; color: var(--text-tertiary); font-size: 13px;
  font-family: var(--font-body); cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.rs-new-category-btn:hover { color: var(--primary); background: var(--primary-soft); }

/* Delete category */
.rs-del-category {
  border: none; background: none; color: var(--text-tertiary); font-size: 11px;
  cursor: pointer; padding: 2px 6px; border-radius: var(--radius-sm); transition: all 0.2s;
}
.rs-del-category:hover { color: var(--danger); background: var(--danger-soft); }

/* Reset button */
.rs-footer-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(61,48,41,0.06); }
.rs-reset-btn {
  flex: 1; height: 38px; border: 1px solid rgba(61,48,41,0.1); border-radius: var(--radius-md);
  background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 500;
  font-family: var(--font-body); cursor: pointer; transition: all 0.2s;
}
.rs-reset-btn:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }

/* ============================================
   Materials Panel
   ============================================ */
/* Guide Carousel (攻略/地图横向轮播) */
.guide-carousel {
  margin-top: 14px;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 14px 16px 14px;
  box-shadow: var(--shadow-card);
}
.guide-carousel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.guide-carousel-title {
  font-size: 13px;
  color: var(--text-tertiary);
  font-weight: 500;
}
.guide-upload-btn {
  border: none;
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
}
.guide-upload-btn:active { transform: scale(0.95); }
.guide-scroll {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}
.guide-scroll::-webkit-scrollbar { display: none; }
.guide-card {
  flex-shrink: 0;
  width: 72%;
  max-width: 300px;
  scroll-snap-align: start;
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--bg-card);
  position: relative;
}
.guide-card img {
  width: 100%;
  display: block;
  cursor: pointer;
}
.guide-card-caption {
  font-size: 12px;
  color: var(--text-secondary);
  padding: 6px 10px;
  line-height: 1.4;
  min-height: 28px;
  cursor: text;
  background: var(--bg-card);
  border-top: none;
  font-family: var(--font-display);
}
.guide-card-caption:empty::before {
  content: '点击添加说明...';
  color: var(--text-tertiary);
  font-style: italic;
}
.guide-card-delete {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: rgba(0, 0, 0, 0.45);
  color: white;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.guide-card:hover .guide-card-delete,
.guide-card:active .guide-card-delete { opacity: 1; }
.guide-empty {
  text-align: center;
  color: var(--text-tertiary);
  font-size: 13px;
  padding: 16px 0 8px;
}
.guide-empty-icon { font-size: 28px; margin-bottom: 4px; }
.guide-dots {
  display: flex;
  justify-content: center;
  gap: 5px;
  margin-top: 8px;
}
.guide-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--text-tertiary);
  opacity: 0.3;
  transition: opacity 0.2s;
}
.guide-dot.active { opacity: 1; background: var(--primary); }

.materials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.material-item { position: relative; aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; background: var(--bg-hover); }
.material-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
.material-item-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.5); color: white; font-size: 10px; padding: 3px 6px; text-align: center; }
.material-item-delete { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; border: none; background: rgba(0,0,0,0.5); color: white; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

/* ============================================
   Notes item style
   ============================================ */
.note-item {
  padding: 10px 14px; background: var(--bg-card); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm); margin-bottom: 8px; position: relative;
}
.note-item-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
.note-item-text { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
.note-item-delete { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border: none; border-radius: 50%; background: transparent; color: var(--text-tertiary); cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.note-item-delete:hover { background: var(--danger-soft); color: var(--danger); }
.note-item-edit { position: absolute; top: 8px; right: 30px; width: 20px; height: 20px; border: none; border-radius: 50%; background: transparent; color: var(--text-tertiary); cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
.note-item-edit:hover { color: var(--primary); background: var(--primary-soft); }

/* Transport raw table (原样渲染) */
.transport-raw-table { width: 100%; border-collapse: separate; border-spacing: 0; border-radius: var(--radius-sm); overflow: hidden; margin-top: 6px; }
.transport-raw-table th { background: var(--bg-hover); padding: 6px 10px; font-size: 11px; font-weight: 600; color: var(--text-secondary); text-align: left; }
.transport-raw-table td { padding: 6px 10px; font-size: 12px; color: var(--text-primary); border-top: 1px solid rgba(61, 48, 41, 0.05); }
.transport-raw-content { font-size: 12px; color: var(--text-primary); line-height: 1.6; margin-top: 4px; }
.transport-raw-content strong { font-weight: 600; color: var(--text-primary); }
.transport-raw-content em { font-style: italic; }

/* Transport sub-sections (随身携带/行李寄存) */
.transport-sub-section { margin-top: 12px; }
.transport-sub-title { font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
.transport-sub-add { width: 20px; height: 20px; border: 1px dashed var(--text-tertiary); border-radius: 50%; background: transparent; color: var(--text-tertiary); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.transport-sub-add:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.transport-sub-list { list-style: none; padding: 0; margin: 0; }
.transport-sub-list li { font-size: 12px; color: var(--text-primary); padding: 4px 0; padding-left: 12px; position: relative; }
.transport-sub-list li::before { content: '•'; position: absolute; left: 0; color: var(--text-tertiary); }
</style>
</head>

<body>
<!-- ============================================
     App Shell
     ============================================ -->
<div class="app-container">

  <!-- ===== PAGE: 碎片 ===== -->
  <div class="page-section active" id="pageFragments">
  <!-- Nav Bar -->
  <nav class="nav-bar">
    <div class="nav-title">我的<span>碎片</span></div>
    <div class="nav-actions">
      <button class="nav-btn" id="importBtn" title="导入 JSON" aria-label="导入数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </button>
      <button class="nav-btn" id="exportBtn" title="导出 JSON" aria-label="导出数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
      <input type="file" id="importInput" accept=".json,application/json" style="display:none">
    </div>
  </nav>

  <!-- Streak Card -->
  <section class="streak-card" id="streakCard">
    <div class="streak-info">
      <div>
        <div class="streak-number" id="streakNum">0</div>
        <div class="streak-label">天连续记录</div>
      </div>
      <span class="streak-emoji" id="streakEmoji">🌱</span>
    </div>
    <div class="heatmap-section">
      <div class="heatmap-label">最近 28 天</div>
      <div class="heatmap-grid" id="heatmapGrid"></div>
    </div>
  </section>

  <!-- Composer -->
  <section class="composer" id="composer">
    <textarea class="composer-textarea" id="textInput" placeholder="记录此刻的想法..." rows="3"></textarea>
    <div class="composer-divider"></div>
    <div class="composer-previews" id="imagePreviews"></div>
    <div class="composer-actions">
      <div class="composer-tools">
        <button class="tool-btn" id="imageBtn" aria-label="添加图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          图片
        </button>
        <input type="file" id="imageInput" accept="image/*" multiple>
      </div>
      <button class="publish-btn" id="publishBtn">发 布</button>
    </div>
  </section>

  <!-- Search -->
  <div class="search-bar" id="searchBar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input class="search-input" id="searchInput" type="text" placeholder="搜索记录...">
    <button class="search-clear" id="searchClear" aria-label="清除搜索">&times;</button>
  </div>

  <!-- Timeline -->
  <div class="timeline" id="timeline"></div>
  </div><!-- /pageFragments -->

  <!-- ===== PAGE: 旅行 ===== -->
  <div class="page-section" id="pageTravel">
    <!-- Travel List View -->
    <div id="travelListView">
      <nav class="travel-nav">
        <div class="travel-nav-title">我的<span>旅行</span></div>
        <div class="nav-actions">
          <button class="nav-btn" id="travelImportJsonBtn" title="导入 JSON">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </button>
          <button class="nav-btn" id="travelExportJsonBtn" title="导出 JSON">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </button>
          <button class="nav-btn" id="manualRefreshBtn" title="手动刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </button>
          <button class="nav-btn" id="replySettingsBtn" title="回复规则设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
      </nav>
      <div class="travel-list" id="travelList"></div>
    </div>

    <!-- Trip Detail View -->
    <div class="trip-detail" id="tripDetailView">
      <nav class="trip-detail-nav">
        <button class="trip-back-btn" id="tripBackBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="trip-detail-title" id="tripDetailTitle">行程详情</div>
        <button class="trip-refresh-btn" id="tripRefreshBtn" title="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>
      </nav>
      <div id="guideCarousel" class="guide-carousel"></div>
      <div id="flightCard" class="flight-card"></div>
      <div id="hotelTimeline" class="hotel-timeline"></div>
      <div id="dayTabs" class="day-tabs"></div>
      <div id="dayContent" class="day-content"></div>
      <div id="transportPanel"></div>
      <div class="sub-tabs" id="subTabs">
        <button class="sub-tab active" data-panel="notes">📝 记事</button>
        <button class="sub-tab" data-panel="checklist">✅ 清单</button>
        <button class="sub-tab" data-panel="lookup">🗺️ 速查</button>
        <button class="sub-tab" data-panel="materials">📎 材料</button>
      </div>
      <div class="sub-content" id="subContent">
        <div class="sub-panel active" id="panelNotes"></div>

  /* ============================

     ============================ */
  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          if (w > MAX_IMG_WIDTH) {
            h = Math.round(h * MAX_IMG_WIDTH / w);
            w = MAX_IMG_WIDTH;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', IMG_QUALITY));
        };
        img.onerror = () => resolve(null);
        img.src = e.target.result;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  }

          canvas.height = h;

          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', GUIDE_QUALITY));
        };
        img.onerror = () => resolve(null);
        img.src = e.target.result;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  }

  /* ============================
     Streak & Heatmap
     ============================ */
  function getDateStr(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function getRecordDates() {
    const dateCounts = {};
    records.forEach(r => {
      const ds = getDateStr(new Date(r.createdAt));
      dateCounts[ds] = (dateCounts[ds] || 0) + 1;
    });
    return dateCounts;
  }

  function calcStreak(dateCounts) {
    const today = new Date();
    let streak = 0;
    for (let i = 0; i < 365; i++) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      if (dateCounts[getDateStr(d)]) {
        streak++;
      } else {
        break;
      }
    }
    return streak;
  }

  // 根据帖子数量返回颜色（1条最浅→10+条最深）
  function getHeatColor(count) {
    if (count <= 0) return '';
    // 5级深浅：1, 2-3, 4-5, 6-9, 10+
    const opacity = count >= 10 ? 1.0
                  : count >= 6  ? 0.8
                  : count >= 4  ? 0.6
                  : count >= 2  ? 0.4
                  :               0.25;
    return `rgba(210, 105, 30, ${opacity})`;
  }

  function getStreakEmoji(streak) {
    if (streak === 0) return '🌱';
    if (streak < 3) return '🌿';
    if (streak < 7) return '🌻';
    if (streak < 14) return '🔥';
    if (streak < 30) return '⭐';
    return '🏆';
  }

  function updateStreak() {
    const dateCounts = getRecordDates();
    const streak = calcStreak(dateCounts);

    streakNum.textContent = streak;
    streakEmoji.textContent = getStreakEmoji(streak);

    // Heatmap: 最近 28 天，今天在右下角（第 4 行第 7 列 = index 27）
    const today = new Date();
    let cells = '';
    for (let i = 27; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dateStr = getDateStr(d);
      const count = dateCounts[dateStr] || 0;
      const isToday = i === 0;
      const classes = ['heatmap-cell'];
      if (count > 0) classes.push('has-record');
      if (isToday) classes.push('is-today');
      const colorStyle = count > 0 ? ` style="--cell-color: ${getHeatColor(count)}"` : '';
      cells += `<div class="${classes.join(' ')}" title="${dateStr}${count > 0 ? ' (' + count + '条)' : ''}"${colorStyle}></div>`;
    }
    heatmapGrid.innerHTML = cells;
  }

     ============================ */

  importInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = JSON.parse(evt.target.result);

        // 兼容两种格式：{ records: [...] } 或直接 [...]
        let importedRecords = [];
        if (Array.isArray(data)) {
          importedRecords = data;
        } else if (data && Array.isArray(data.records)) {
          importedRecords = data.records;
        } else {
          showToast('⚠️ JSON 格式不正确');
          return;
        }

        // 验证 & 标准化每条记录
        let validCount = 0;
        const existingIds = new Set(records.map(r => r.id));

        importedRecords.forEach(r => {
          // 至少要有 text 或 images
          if (!r.text && (!r.images || r.images.length === 0)) return;

          // 生成新 id 避免重复
          const newId = r.id && !existingIds.has(r.id)
            ? r.id
            : Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + validCount;

          const entry = {
            id: newId,
            text: r.text || '',
            images: Array.isArray(r.images) ? r.images : [],
            createdAt: r.createdAt || new Date().toISOString()
          };
          // 保留已有的 reply
          if ('reply' in r) {
            entry.reply = r.reply;
          }
          records.push(entry);

          existingIds.add(newId);
          validCount++;
        });

        if (validCount === 0) {
          showToast('⚠️ 未找到有效记录');
          return;
        }

        // 按时间倒序排列
        records.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        // 为缺少 reply 的导入记录生成回复
        migrateReplies();
        renderTimeline();
        updateStreak();
        showToast(`📥 成功导入 ${validCount} 条记录`);
      } catch (err) {
        showToast('⚠️ JSON 解析失败，请检查文件格式');
      }
    };
    reader.readAsText(file);
    importInput.value = '';
  });

  /* ============================
     Utilities
     ============================ */
  function escapeHtml(str) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return str.replace(/[&<>"']/g, c => map[c]);

  /* ============================
     Light Reply Generator
     ============================ */
  function randomPick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function generateLightReply(record, allRecords) {
    // 70% 概率显示
    if (Math.random() > 0.7) return null;

    const text = record.text || '';
    const lowerText = text;
    const postDate = new Date(record.createdAt);
    const postHour = postDate.getHours();
    const postMinutes = postDate.getMinutes();
    const postTimeInMin = postHour * 60 + postMinutes;

    // 优先级1：关键词匹配（动态遍历所有分类）
    const ruleOrder = Object.keys(REPLY_RULES);
    for (const category of ruleOrder) {
      const rule = REPLY_RULES[category];
      if (rule && rule.keywords && rule.keywords.some(kw => lowerText.includes(kw))) {
        let reply = randomPick(rule.replies);
        if (Math.random() < 0.4) {
          reply += randomPick(EMOJI_POOL);
        }
        return reply;
      }
    }

    // 优先级2：时间触发（23:00 - 03:00）
    if (postTimeInMin >= 23 * 60 || postTimeInMin < 3 * 60) {
      let reply = randomPick(LATE_NIGHT_REPLIES);
      if (Math.random() < 0.4) reply += randomPick(EMOJI_POOL);
      return reply;
    }

    // 优先级3：数量触发（当天 >= 5 条，仅最后一条显示）
    const recordDateStr = getDateStr(postDate);
    const sameDayRecords = allRecords
      .filter(r => getDateStr(new Date(r.createdAt)) === recordDateStr)
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

    if (sameDayRecords.length >= 5 && sameDayRecords[0].id === record.id) {
      let reply = randomPick(BUSY_DAY_REPLIES);
      if (Math.random() < 0.4) reply += randomPick(EMOJI_POOL);
      return reply;
    }

    // 优先级4：默认兜底
    let reply = randomPick(DEFAULT_REPLIES);
    if (Math.random() < 0.4) reply += randomPick(EMOJI_POOL);
    return reply;
  }

  // 获取固定回复：仅读取已存储的 reply 字段（迁移在 init 阶段完成）
  function getFixedReply(record) {
    if ('reply' in record) {
      return record.reply;
    }
    // 理论上不会到这里（init 时已迁移），兜底返回 null
    return null;
  }

  // 启动时一次性迁移所有缺少 reply 字段的旧记录
  function migrateReplies() {
    let dirty = false;
    records.forEach(record => {
      if (!('reply' in record)) {
        record.reply = generateLightReply(record, records) || null;
        dirty = true;
      }
    });
    if (dirty) {
      saveRecords();
    }
  }

  function formatTime(date) {
    const now = new Date();
    const diff = now - date;
    const min = Math.floor(diff / 60000);
    const hr = Math.floor(diff / 3600000);

    if (min < 1) return '刚刚';
    if (min < 60) return `${min} 分钟前`;
    if (hr < 24 && now.getDate() === date.getDate()) {
      return `今天 ${padTime(date.getHours())}:${padTime(date.getMinutes())}`;
    }

    const yesterday = new Date(now);
    yesterday.setDate(yesterday.getDate() - 1);
    if (date.getDate() === yesterday.getDate() &&
        date.getMonth() === yesterday.getMonth() &&
        date.getFullYear() === yesterday.getFullYear()) {
      return `昨天 ${padTime(date.getHours())}:${padTime(date.getMinutes())}`;
    }

    if (date.getFullYear() === now.getFullYear()) {
      return `${date.getMonth() + 1}月${date.getDate()}日 ${padTime(date.getHours())}:${padTime(date.getMinutes())}`;
    }

    return `${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${padTime(date.getHours())}:${padTime(date.getMinutes())}`;
  }

  function padTime(n) { return String(n).padStart(2, '0'); }

  /* ============================
     PWA: Manifest & Service Worker
     ============================ */
  function registerPWA() {
    // Inline manifest
    const manifest = {
      name: '我的碎片',
      short_name: '碎片',
      description: '私人碎片化记录工具',
      start_url: '.',
      display: 'standalone',
      background_color: '#FAF6F0',
      theme_color: '#FAF6F0',
      icons: [
        {
          src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#FAF6F0"/><text x="256" y="320" text-anchor="middle" font-size="280">📝</text></svg>'),
          sizes: '512x512',
          type: 'image/svg+xml',
          purpose: 'any maskable'
        }
      ]
    };

    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);

    // Service Worker (versioned cache + update support)
    if ('serviceWorker' in navigator) {
      const CACHE_NAME = 'fragments-v' + APP_VERSION;
      const swCode = `
        const CACHE_NAME = '${CACHE_NAME}';

        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });

        self.addEventListener('activate', (e) => {
          e.waitUntil(
            caches.keys().then((keys) => {
              return Promise.all(
                keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k))
              );
            }).then(() => clients.claim())
          );
        });

        self.addEventListener('fetch', (e) => {
          const url = new URL(e.request.url);
          // version.json 永远走网络，不缓存
          if (url.pathname.endsWith('version.json')) {
            e.respondWith(fetch(e.request));
            return;
          }
          // 其他资源：缓存优先，缓存没有则走网络
          e.respondWith(
            caches.match(e.request).then((cached) => {
              if (cached) return cached;
              return fetch(e.request).then((res) => {
                const clone = res.clone();
                caches.open(CACHE_NAME).then((cache) => cache.put(e.request, clone));
                return res;
              });
            })
          );
        });

        // 监听来自页面的消息（强制更新）
        self.addEventListener('message', (e) => {
          if (e.data === 'skipWaiting') self.skipWaiting();
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).then((reg) => {
        // 检测到新 SW 安装完成时通知用户
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          if (newSW) {
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'activated') {
                showUpdateBanner();
              }
            });
          }
        });
      }).catch(() => {});
    }
  }
